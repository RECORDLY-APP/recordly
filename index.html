<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Recordly — Simple records, clear progress</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e4e8f0;--green:#176b50;--green2:#e2f5ec;--red:#b42318;--blue:#2448a5;--shadow:0 8px 26px #15203b0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;font-weight:650;background:#e9edf5;color:var(--text)}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--green);color:#fff}.soft{background:var(--green2);color:var(--green)}.danger{background:#fff0ee;color:var(--red)}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 18px}.brand{font-size:23px;font-weight:850;letter-spacing:-.7px}.brand span{color:var(--green)}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}h1,h2,h3,p{margin-top:0}h1{font-size:25px;line-height:1.2;letter-spacing:-.6px}h2{font-size:18px;margin-bottom:12px}h3{font-size:15px;margin-bottom:8px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.stat{padding:15px;border-radius:14px;background:#f7f9fc;border:1px solid var(--line)}.stat strong{display:block;font-size:22px;letter-spacing:-.4px}.field{margin:12px 0}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #d5dbe6;border-radius:10px;padding:12px;background:#fff;color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:#43866d;box-shadow:0 0 0 3px #176b5018}textarea{resize:vertical}.list{display:grid;gap:9px}.item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.avatar{width:42px;height:42px;border-radius:13px;background:var(--green2);color:var(--green);display:grid;place-items:center;font-weight:800;flex-shrink:0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1f7;font-size:12px;font-weight:700}.progress{height:7px;background:#e8edf3;border-radius:20px;overflow:hidden;margin-top:7px}.progress i{height:100%;display:block;background:var(--green);border-radius:20px}.tabs{display:flex;gap:7px;overflow:auto;margin:8px 0 14px}.tabs button{white-space:nowrap}.tabs .active{background:var(--green);color:white}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:12px;background:#fff5d9;color:#6c4d00;margin:12px 0}.error{background:#fff0ee;color:var(--red)}.success{background:var(--green2);color:var(--green)}.small{font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 0}.linkbox{overflow-wrap:anywhere;background:#f7f9fc;padding:10px;border-radius:10px;border:1px dashed #cbd3df;font-size:13px}.empty{text-align:center;padding:26px 12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#10182799;display:grid;place-items:center;padding:16px;z-index:9}.modalbox{width:min(100%,440px);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:20px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:11px 16px;border-radius:12px;z-index:20;max-width:90%;box-shadow:var(--shadow)}.tagline{max-width:520px;color:var(--muted)}.right{text-align:right}@media(min-width:650px){.wrap{padding:24px}.card{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="brand">Record<span>ly</span></div><div class="muted">Simple records. Clear progress.</div></div><div class="row" id="topActions"></div></header>
<div id="app"><div class="card"><h1>Welcome to Recordly</h1><p class="muted">Loading your records workspace…</p></div></div>
<div class="foot">Recordly · Keep every contribution clear.</div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const SB_URL='https://ptcdywucfpbnocxlxoog.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0Y2R5d3VjZnBibm9jeGx4b29nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NDg3MzMsImV4cCI6MjEwODMyNDczM30.UQSzIfYXD5EOaypvzARTk3gWv1OGJf9kcxkP7XJKBuk';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
let user=null, currentRecord=null, currentPerson=null, activeTab='progress', paymentsChannel=null;
const money=n=>new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:2}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=id=>($(id)?.value||'').trim();
const hash=()=>location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
const link=path=>location.origin+location.pathname+'#/'+path;
function toast(s){$('toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('toastRoot').innerHTML='',3200)}
function setTop(){ $('topActions').innerHTML=user?`<span class="muted">${esc(user.user_metadata?.name||user.email||'Account')}</span><button id="logoutBtn">Log out</button>`:`<button class="soft" id="loginBtn">Log in</button><button class="primary" id="signupBtn">Create account</button>`; if($('logoutBtn'))$('logoutBtn').onclick=logout;if($('loginBtn'))$('loginBtn').onclick=()=>authModal('login');if($('signupBtn'))$('signupBtn').onclick=()=>authModal('signup')}
function authModal(mode){$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="row between"><h2>${mode==='signup'?'Create your account':'Welcome back'}</h2><button onclick="closeModal()">✕</button></div><div id="authMsg" class="notice hidden"></div>${mode==='signup'?`<div class="field"><label for="authName">Your name</label><input id="authName" autocomplete="name" placeholder="Full name"></div>`:''}<div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="authPass">Password</label><input id="authPass" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" placeholder="At least 6 characters"></div><button class="primary" style="width:100%" id="authSubmit">${mode==='signup'?'Create account':'Log in'}</button><p class="muted small" style="margin-top:12px">${mode==='signup'?'Already registered?':'New to Recordly?'} <a href="#" id="switchAuth">${mode==='signup'?'Log in':'Create an account'}</a></p><p class="muted small">If you create an account, Supabase may ask you to confirm your email before logging in.</p></div></div>`;
$('switchAuth').onclick=e=>{e.preventDefault();authModal(mode==='signup'?'login':'signup')};
$('authSubmit').onclick=async()=>{const email=val('authEmail'),password=$('authPass').value; if(!email||!password){authMessage('Enter your email and password.');return} const b=$('authSubmit');b.disabled=true;b.textContent='Please wait…';try{let result;if(mode==='signup'){result=await sb.auth.signUp({email,password,options:{data:{name:val('authName')}}});if(!result.error&&!result.data.session){authMessage('Account created. Check your email to confirm your account, then log in.');b.disabled=false;b.textContent='Create account';return}}else result=await sb.auth.signInWithPassword({email,password});if(result.error)throw result.error;closeModal();toast(mode==='signup'?'Account created.':'You are logged in.');await render()}catch(e){authMessage(e.message||'Login failed. Please try again.');b.disabled=false;b.textContent=mode==='signup'?'Create account':'Log in'} }}
function authMessage(m){const el=$('authMsg');el.textContent=m;el.classList.remove('hidden');el.classList.add('error')}
function closeModal(){$('modalRoot').innerHTML=''}
async function logout(){await sb.auth.signOut();user=null;location.hash='/';await render()}
function showError(e){$('app').innerHTML=`<div class="card"><h2>Something went wrong</h2><div class="notice error">${esc(e.message||String(e))}</div><button onclick="render()" class="primary">Try again</button><p class="muted small">If this mentions a table or permission, the Supabase database setup may need checking.</p></div>`}
function pageTitle(title,desc=''){return `<div class="row between"><div><h1>${esc(title)}</h1>${desc?`<p class="tagline">${esc(desc)}</p>`:''}</div></div>`}
function noItems(title,desc){return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(desc)}</p></div>`}
async function render(){setTop();try{const p=hash();if(p[0]==='p'&&p[1])return await publicPerson(p[1]);if(p[0]==='g'&&p[1])return await publicGroup(p[1]);if(!user){$('app').innerHTML=`<div class="card"><div class="pill">RECORD KEEPING MADE SIMPLE</div><h1 style="margin-top:14px">Know what came in, what is due, and what remains.</h1><p class="tagline">Create a record, add people, log payments, and share a progress link so everyone stays informed.</p><div class="row"><button class="primary" onclick="authModal('signup')">Get started</button><button onclick="authModal('login')">I already have an account</button></div></div><div class="grid"><div class="card"><h2>📋 Organize records</h2><p class="muted">Keep sales, dues, and group contributions in one place.</p></div><div class="card"><h2>💰 Track payments</h2><p class="muted">See amounts paid, targets, and outstanding balances.</p></div><div class="card"><h2>🔗 Share progress</h2><p class="muted">Give each person a private progress link.</p></div></div>`;return}if(p[0]==='new')return newRecord();if(p[0]==='r'&&p[1]&&p[2])return personAdmin(p[1],p[2]);if(p[0]==='r'&&p[1])return recordPage(p[1]);return home()}catch(e){showError(e)}}
async function home(){const {data,error}=await sb.from('records').select('id,title,target,end_date,created_at,people(id,payments(amount))').order('created_at',{ascending:false});if(error)throw error;const rows=data||[];const total=rows.reduce((a,r)=>a+r.people.reduce((b,p)=>b+(p.payments||[]).reduce((c,x)=>c+Number(x.amount||0),0),0),0);const count=rows.reduce((a,r)=>a+r.people.length,0);$('app').innerHTML=pageTitle('Your workspace','A clear view of your records and collections')+`<div class="grid"><div class="stat"><span class="muted">Total collected</span><strong>${money(total)}</strong></div><div class="stat"><span class="muted">Records</span><strong>${rows.length}</strong></div><div class="stat"><span class="muted">People tracked</span><strong>${count}</strong></div></div><div class="row between" style="margin-top:22px"><h2>Your records</h2><button class="primary" onclick="location.hash='/new'">＋ New record</button></div><div class="list">${rows.length?rows.map(r=>{const paid=r.people.reduce((a,p)=>a+(p.payments||[]).reduce((b,x)=>b+Number(x.amount||0),0),0),target=Number(r.target||0)*r.people.length,pc=target?Math.min(100,Math.round(paid/target*100)):0;return `<div class="item" onclick="location.hash='/r/${r.id}'" style="cursor:pointer"><div class="avatar">${esc((r.title||'?').slice(0,1).toUpperCase())}</div><div class="grow"><b>${esc(r.title)}</b><div class="muted">${r.people.length} people · ${money(paid)} collected</div>${target?`<div class="progress"><i style="width:${pc}%"></i></div>`:''}</div><span>›</span></div>`}).join(''):noItems('No records yet','Create your first record to get started.')}</div>`}
function newRecord(){$('app').innerHTML=`<button onclick="location.hash='/'">← Back to workspace</button><div class="card"><h1>New record</h1><p class="muted">Create a sales, dues, or contribution record.</p><div class="field"><label for="recordTitle">Record title *</label><input id="recordTitle" placeholder="e.g. Class contribution or Product sales"></div><div class="field"><label for="recordTarget">Target amount per person (optional, ₦)</label><input id="recordTarget" type="number" min="0" inputmode="decimal" placeholder="e.g. 10000"></div><div class="field"><label for="recordDate">End date (optional)</label><input id="recordDate" type="date"></div><div class="field"><label for="recordPeople">People (optional, one person per line: name, phone)</label><textarea id="recordPeople" rows="5" placeholder="Amina, 08012345678&#10;David, 08087654321"></textarea></div><button class="primary" id="saveRecord">Save record</button></div>`;$('saveRecord').onclick=saveRecord}
async function saveRecord(){const title=val('recordTitle');if(!title){toast('Enter a title first.');return}const target=Number(val('recordTarget'))||null;const {data,error}=await sb.from('records').insert({title,target,end_date:val('recordDate')||null}).select('id').single();if(error){toast(error.message);return}const people=val('recordPeople').split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const a=line.split(',');return{record_id:data.id,name:a[0].trim(),phone:(a.slice(1).join(',')||'').trim()||null}});if(people.length){const result=await sb.from('people').insert(people);if(result.error){toast('Record saved, but people could not be added: '+result.error.message);location.hash='/r/'+data.id;return}}toast('Record created.');location.hash='/r/'+data.id}
async function recordPage(id){const {data:r,error}=await sb.from('records').select('id,title,target,end_date,show_table,group_link,people(id,name,phone,payments(id,amount,paid_on,note,created_at))').eq('id',id).single();if(error)throw error;currentRecord=r;const people=r.people||[];const total=people.reduce((a,p)=>a+(p.payments||[]).reduce((b,x)=>b+Number(x.amount||0),0),0);$('app').innerHTML=`<button onclick="location.hash='/'">← Workspace</button><div class="card">${pageTitle(r.title,'Record overview')}<div class="grid"><div class="stat"><span class="muted">Total collected</span><strong>${money(total)}</strong></div><div class="stat"><span class="muted">People</span><strong>${people.length}</strong></div><div class="stat"><span class="muted">Target per person</span><strong>${r.target?money(r.target):'Not set'}</strong></div></div>${r.end_date?`<p class="muted" style="margin-top:12px">End date: ${esc(r.end_date)}</p>`:''}</div><div class="row between"><h2>People and payments</h2><button class="primary" onclick="addPersonForm('${r.id}')">＋ Add person</button></div><div class="list">${people.length?people.map(p=>{const paid=(p.payments||[]).reduce((a,x)=>a+Number(x.amount||0),0),pc=r.target?Math.min(100,Math.round(paid/Number(r.target)*100)):0;return `<div class="item"><div class="avatar">${esc((p.name||'?').slice(0,1).toUpperCase())}</div><div class="grow" style="cursor:pointer" onclick="location.hash='/r/${r.id}/${p.id}'"><b>${esc(p.name)}</b><div class="muted">${esc(p.phone||'No phone added')} · ${money(paid)} paid</div>${r.target?`<div class="progress"><i style="width:${pc}%"></i></div><span class="muted small">${pc}% of target</span>`:''}</div><button onclick="location.hash='/r/${r.id}/${p.id}'">Open</button></div>`}).join(''):noItems('No people yet','Add people to begin tracking payments.')}</div><div class="card"><h2>Sharing options</h2><div class="row between"><div class="grow"><b>Group table</b><div class="muted">Let visitors compare group progress.</div></div><button id="toggleTable" class="${r.show_table?'soft':''}">${r.show_table?'On':'Off'}</button></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="row between"><div class="grow"><b>Shared group link</b><div class="muted">Visitors can choose their name.</div></div><button id="toggleGroup" class="${r.group_link?'soft':''}">${r.group_link?'On':'Off'}</button></div>${r.group_link?`<div class="linkbox" style="margin-top:12px">${esc(link('g/'+r.id))}</div><button style="margin-top:8px" onclick="copyText('${esc(link('g/'+r.id))}')">Copy group link</button>`:''}</div>`;
$('toggleTable').onclick=()=>updateRecord(r.id,{show_table:!r.show_table});$('toggleGroup').onclick=()=>updateRecord(r.id,{group_link:!r.group_link})}
async function updateRecord(id,patch){const{error}=await sb.from('records').update(patch).eq('id',id);if(error){toast(error.message);return}render()}
function addPersonForm(id){$('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="row between"><h2>Add a person</h2><button onclick="closeModal()">✕</button></div><div class="field"><label for="personName">Name *</label><input id="personName"></div><div class="field"><label for="personPhone">Phone (optional)</label><input id="personPhone" inputmode="tel"></div><button class="primary" id="addPersonSave">Add person</button></div></div>`;$('addPersonSave').onclick=async()=>{const name=val('personName');if(!name){toast('Enter a name.');return}const{error}=await sb.from('people').insert({record_id:id,name,phone:val('personPhone')||null});if(error){toast(error.message);return}closeModal();toast('Person added.');render()}}
async function personAdmin(rid,pid){const{data:p,error}=await sb.from('people').select('id,name,phone,records(id,title,target),payments(id,amount,paid_on,note,created_at)').eq('id',pid).single();if(error)throw error;currentPerson=p;const pays=(p.payments||[]).slice().sort((a,b)=>(b.paid_on||'').localeCompare(a.paid_on||''));const paid=pays.reduce((a,x)=>a+Number(x.amount||0),0),target=Number(p.records?.target||0);$('app').innerHTML=`<button onclick="location.hash='/r/${rid}'">← ${esc(p.records?.title||'Record')}</button><div class="card">${pageTitle(p.name,'Payment account')}<p class="muted">${esc(p.phone||'No phone added')}</p><div class="grid"><div class="stat"><span class="muted">Total paid</span><strong>${money(paid)}</strong></div><div class="stat"><span class="muted">Remaining</span><strong>${target?money(Math.max(0,target-paid)):'No target'}</strong></div></div></div><div class="card"><h2>Log a payment</h2><div class="field"><label for="payAmount">Amount (₦) *</label><input id="payAmount" type="number" min="1" inputmode="decimal" placeholder="Amount received"></div><div class="field"><label for="payDate">Payment date</label><input id="payDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label for="payNote">Payment method or note (private to record owner and eligible payer)</label><input id="payNote" placeholder="Cash, bank transfer, reference"></div><button class="primary" id="savePayment">Save payment</button></div><div class="card"><h2>Personal progress link</h2><p class="muted">Share this link with the person so they can view their progress.</p><div class="linkbox">${esc(link('p/'+p.id))}</div><button style="margin-top:8px" onclick="copyText('${esc(link('p/'+p.id))}')">Copy personal link</button></div><div class="card"><h2>Payment history</h2>${pays.length?`<div class="list">${pays.map(x=>`<div class="item"><div class="grow"><b>${money(x.amount)}</b><div class="muted">${esc(x.paid_on||'Date not set')} ${x.note?'· '+esc(x.note):''}</div></div></div>`).join('')}</div>`:noItems('No payments yet','Payments you log will appear here.')}</div>`;$('savePayment').onclick=()=>savePayment(pid)}
async function savePayment(pid){const amount=Number(val('payAmount'));if(!amount||amount<0){toast('Enter a valid payment amount.');return}const{error}=await sb.from('payments').insert({person_id:pid,amount,paid_on:val('payDate')||new Date().toISOString().slice(0,10),note:val('payNote')||null});if(error){toast(error.message);return}toast('Payment saved.');render()}
async function publicPerson(pid){const{data:d,error}=await sb.rpc('get_person_view',{pid});if(error)throw error;if(!d){$('app').innerHTML=noItems('Link not found','Check that the link is correct.');return}const pays=d.payments||[],paid=pays.reduce((a,x)=>a+Number(x.amount||0),0),target=Number(d.target||0),pc=target?Math.min(100,Math.round(paid/target*100)):0;activeTab=activeTab||'progress';$('app').innerHTML=`<div class="card">${pageTitle(d.name,'Payment progress')}<p class="muted">${esc(d.title)}</p><div class="stat"><span class="muted">Total paid</span><strong>${money(paid)}</strong>${target?`<div class="progress"><i style="width:${pc}%"></i></div><p class="muted" style="margin:8px 0 0">${pc}% complete · ${money(Math.max(0,target-paid))} remaining</p>`:'<p class="muted" style="margin:8px 0 0">No fixed target was set.</p>'}</div><div class="tabs"><button class="${activeTab==='progress'?'active':''}" onclick="activeTab='progress';publicPerson('${pid}')">Progress</button><button class="${activeTab==='history'?'active':''}" onclick="activeTab='history';publicPerson('${pid}')">History</button>${d.table?`<button class="${activeTab==='table'?'active':''}" onclick="activeTab='table';publicPerson('${pid}')">Group table</button>`:''}<button class="${activeTab==='comments'?'active':''}" onclick="activeTab='comments';publicPerson('${pid}')">Comments</button></div>${activeTab==='history'?`<h2>Payment history</h2>${pays.length?pays.map(x=>`<div class="item"><span class="grow">${esc(x.paid_on||'Payment')}</span><b>${money(x.amount)}</b></div>`).join(''):noItems('No payments yet','Your payment history will appear here.')}`:activeTab==='table'&&d.table?`<h2>Group table</h2><div class="tablewrap"><table><tr><th>#</th><th>Name</th><th>Paid</th></tr>${d.table.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${money(x.paid)}</td></tr>`).join('')}</table></div>`:activeTab==='comments'?`<h2>Comments</h2>${user?(d.me?`<div class="muted">Comments are available on your claimed page.</div>`:d.claimed?`<p class="muted">This page has already been claimed by an account.</p>`:`<p>Claim this page to comment and receive alerts.</p><button class="primary" onclick="claimPage('${pid}')">This is my page</button>`):`<p class="muted">Log in to claim your page and comment.</p><button class="primary" onclick="authModal('login')">Log in</button>`}`:`<h2>Progress summary</h2><p class="muted">This page shows your total payments recorded by the owner.</p>`}</div>`}
async function claimPage(pid){const{error}=await sb.rpc('claim_person',{pid});if(error){toast(error.message);return}toast('Page claim submitted.');publicPerson(pid)}
async function publicGroup(rid){const{data:d,error}=await sb.rpc('get_group_people',{rid});if(error)throw error;if(!d){$('app').innerHTML=noItems('Group link unavailable','Ask the record owner to enable the shared group link.');return}$('app').innerHTML=`<div class="card">${pageTitle(d.title,'Choose your name to view your progress')}<div class="list">${(d.people||[]).map(p=>`<div class="item" style="cursor:pointer" onclick="location.hash='/p/${p.id}'"><div class="avatar">${esc((p.name||'?').slice(0,1).toUpperCase())}</div><div class="grow"><b>${esc(p.name)}</b></div><span>›</span></div>`).join('')}</div></div>`}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Link copied.')}catch(e){prompt('Copy this link:',text)}}
async function start(){const{data}=await sb.auth.getSession();user=data.session?.user||null;sb.auth.onAuthStateChange((event,session)=>{user=session?.user||null;setTop();render()});addEventListener('hashchange',render);await render()}
start();
</script>
</body>
</html>
