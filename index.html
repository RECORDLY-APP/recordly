<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f766e">
<title>Recordly — Simple records, clear progress</title>
<meta name="description" content="Simple records, clear progress. Track contributions, business sales, expenses, and debts with private progress links and instant receipts.">
<meta property="og:title" content="Recordly — Simple records, clear progress">
<meta property="og:description" content="Simple records, clear progress. Track contributions, business sales, expenses, and debts with private progress links and instant receipts.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://ptcdywucfpbnocxlxoog.supabase.co" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --primary: #0f766e;
  --primary-dark: #115e59;
  --primary-light: #ccfbf1;
  --accent-blue: #2563eb;
  --accent-blue-light: #dbeafe;
  --accent-amber: #d97706;
  --accent-amber-light: #fef3c7;
  --accent-red: #e11d48;
  --accent-red-light: #ffe4e6;
  --accent-purple: #7c3aed;
  --accent-purple-light: #ede9fe;
  --box-bg: #f8fafc;
  --header-bg: rgba(244, 246, 251, 0.95);
  --modal-bg: #ffffff;
  --input-bg: #ffffff;
  --input-border: #cbd5e1;
  --radius: 16px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
  --shadow: 0 8px 24px rgba(15,23,42,0.06);
  --shadow-lg: 0 18px 40px rgba(15,23,42,0.12);
}

[data-theme="dark"] {
  --bg: #0b0f19;
  --card: #151e2e;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --line: #24324a;
  --primary: #14b8a6;
  --primary-dark: #0d9488;
  --primary-light: #133938;
  --accent-blue: #3b82f6;
  --accent-blue-light: #1e293b;
  --accent-amber: #f59e0b;
  --accent-amber-light: #2d2617;
  --accent-red: #f43f5e;
  --accent-red-light: #3b1722;
  --accent-purple: #a855f7;
  --accent-purple-light: #2e1d4d;
  --box-bg: #0f172a;
  --header-bg: rgba(11, 15, 25, 0.95);
  --modal-bg: #151e2e;
  --input-bg: #0f172a;
  --input-border: #334155;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 18px 40px rgba(0,0,0,0.5);
}


/* Pure black theme (true black background, good for OLED screens) */
[data-theme="black"] {
  --bg: #000000;
  --card: #0a0a0a;
  --text: #f5f5f5;
  --muted: #a3a3a3;
  --line: #262626;
  --primary: #14b8a6;
  --primary-dark: #0d9488;
  --primary-light: #0b2422;
  --accent-blue: #3b82f6;
  --accent-blue-light: #0f1a2e;
  --accent-amber: #f59e0b;
  --accent-amber-light: #231a08;
  --accent-red: #f43f5e;
  --accent-red-light: #2a0d15;
  --accent-purple: #a855f7;
  --accent-purple-light: #1e1233;
  --box-bg: #0a0a0a;
  --header-bg: rgba(0, 0, 0, 0.95);
  --modal-bg: #0d0d0d;
  --input-bg: #0a0a0a;
  --input-border: #333333;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.6);
  --shadow: 0 8px 24px rgba(0,0,0,0.7);
  --shadow-lg: 0 18px 40px rgba(0,0,0,0.8);
}
[data-theme="dark"], [data-theme="black"] { color-scheme: dark; }
[data-theme="light"] { color-scheme: light; }
[data-theme="black"] { --onp: #04211f; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14.5px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  padding-bottom: 78px;
  transition: background 0.2s ease, color 0.2s ease;
}
body.modal-open { overflow: hidden; }

@media (min-width: 768px) {
  body { padding-bottom: 30px; }
}

/* Layout */
.app-container {
  max-width: 1020px;
  margin: 0 auto;
  padding: 12px 16px;
}
@media (min-width: 650px) {
  .app-container { padding: 20px 24px; }
}

/* Top bar */
.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0 14px;
  position: sticky;
  top: 0;
  background: var(--header-bg);
  backdrop-filter: blur(10px);
  z-index: 20;
}
.brand-group { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0b3b3c, #0f766e 55%, #14b8a6);
  color: white;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 19px;
  box-shadow: 0 4px 10px rgba(15,118,110,0.25);
  overflow: hidden;
}
.brand-icon svg, .lp-logo svg, .sp-logo svg { width: 100%; height: 100%; display: block; }
.brand-text { font-size: 21px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; }
.brand-text span { color: var(--primary); }
.brand-tag { font-size: 11px; color: var(--muted); font-weight: 500; }

.header-actions { display: flex; align-items: center; gap: 6px; }

/* Buttons & Inputs */
button, input, textarea, select { font: inherit; }
button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 8px 13px;
  font-weight: 600;
  background: var(--box-bg);
  color: var(--text);
  border: 1px solid var(--line);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}
button:focus-visible, a:focus-visible, [role="button"]:focus-visible, .rrow:focus-visible, .arow:focus-visible, .srow:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.55; cursor: not-allowed; }

.btn-primary { background: var(--primary); color: #fff; border: none; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-soft { background: var(--primary-light); color: var(--primary); border: none; }
.btn-soft:hover { filter: brightness(0.96); }
.btn-danger { background: var(--accent-red-light); color: var(--accent-red); border: none; }
.btn-danger:hover { background: #fecdd3; }
.btn-amber { background: var(--accent-amber-light); color: var(--accent-amber); border: none; }
.btn-blue { background: var(--accent-blue-light); color: var(--accent-blue); border: none; }
.btn-outline { background: transparent; border: 1px solid var(--line); color: var(--text); }
.btn-outline:hover { background: var(--box-bg); }
.btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; min-height: 32px; }
.btn-icon { width: 40px; height: 40px; padding: 0; border-radius: 10px; }

/* Navigation bottom bar */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--header-bg);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
  box-shadow: 0 -4px 16px rgba(15,23,42,0.04);
}
@media (min-width: 768px) {
  .bottom-nav {
    position: static;
    border-radius: 14px;
    border: 1px solid var(--line);
    margin-bottom: 20px;
    padding: 6px;
    box-shadow: var(--shadow-sm);
  }
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--muted);
  padding: 6px 10px;
  min-height: 44px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 600;
  gap: 3px;
  flex: 1;
  max-width: 110px;
  border: none;
  transition: background 0.15s ease, color 0.15s ease;
}
.nav-item:hover:not(.active) {
  color: var(--text);
  background: var(--box-bg);
}
.nav-item.active {
  color: var(--primary);
  background: var(--primary-light);
}
.nav-item svg { width: 19px; height: 19px; stroke-width: 2.2; }

/* Cards & Layout */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
@media (min-width: 650px) {
  .card { padding: 20px; margin-bottom: 18px; }
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

h1, h2, h3, p { margin-top: 0; }
h1, h2 { text-wrap: balance; }
h1 { font-size: 23px; line-height: 1.25; letter-spacing: -0.5px; }
h2 { font-size: 17px; margin-bottom: 10px; font-weight: 700; }
h3 { font-size: 15px; margin-bottom: 6px; font-weight: 650; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

/* Metric Stat Box */
.stat-box {
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--box-bg);
  border: 1px solid var(--line);
}
.stat-box .stat-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.stat-box .stat-val { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; margin-top: 3px; color: var(--text); font-variant-numeric: tabular-nums; }
.stat-val, table, .stmt-paper, .badge, .item-card, .rrow, .arow { font-variant-numeric: tabular-nums; }
.stat-box.green { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.3); }
.stat-box.green .stat-val { color: var(--primary); }
.stat-box.red { background: rgba(225,29,72,0.08); border-color: rgba(225,29,72,0.3); }
.stat-box.red .stat-val { color: var(--accent-red); }
.stat-box.blue { background: rgba(37,99,235,0.08); border-color: rgba(37,99,235,0.3); }
.stat-box.blue .stat-val { color: var(--accent-blue); }
.stat-box.amber { background: rgba(217,119,6,0.08); border-color: rgba(217,119,6,0.3); }
.stat-box.amber .stat-val { color: var(--accent-amber); }

/* Quick Actions */
.action-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
  margin-bottom: 16px;
}
@media (min-width: 600px) {
  .action-grid { grid-template-columns: repeat(4, 1fr); }
}
.action-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 12px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 0.15s ease;
}
.action-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.action-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 16px;
}

/* Badges & Pills */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1;
}
.badge-green { background: var(--primary-light); color: var(--primary); }
.badge-red { background: var(--accent-red-light); color: var(--accent-red); }
.badge-amber { background: var(--accent-amber-light); color: var(--accent-amber); }
.badge-blue { background: var(--accent-blue-light); color: var(--accent-blue); }
.badge-gray { background: var(--box-bg); color: var(--muted); border: 1px solid var(--line); }

/* Progress bar */
.progress-track {
  height: 7px;
  background: var(--line);
  border-radius: 20px;
  overflow: hidden;
  margin: 6px 0;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #10b981, #0f766e);
  border-radius: 20px;
  transition: width 0.3s ease;
}

/* Lists and Items */
.list { display: grid; gap: 9px; }
.item-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  transition: border-color 0.15s ease;
}
.item-card:hover { border-color: #94a3b8; }
.member-item-enter {
  animation: memberFadeIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
  animation-delay: calc(var(--mi, 0) * 32ms);
}
.member-item-new {
  animation: memberNewFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes memberFadeIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes memberNewFadeIn {
  0% {
    opacity: 0;
    transform: translateY(8px) scale(0.985);
    border-color: var(--primary);
    background: var(--primary-light);
  }
  45% {
    opacity: 1;
    transform: translateY(0) scale(1);
    border-color: var(--primary);
    background: var(--primary-light);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
    border-color: var(--line);
    background: var(--card);
  }
}
.avatar-circle {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--primary-light);
  color: var(--primary);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 15px;
  flex-shrink: 0;
}
.avatar-blue { background: var(--accent-blue-light); color: var(--accent-blue); }
.avatar-amber { background: var(--accent-amber-light); color: var(--accent-amber); }
.avatar-red { background: var(--accent-red-light); color: var(--accent-red); }

/* Tabs */
.tab-bar {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px;
  background: var(--box-bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 14px;
}
.tab-btn {
  flex: 1;
  white-space: nowrap;
  background: transparent;
  color: var(--muted);
  border: none;
  padding: 8px 12px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
}
.tab-btn.active {
  background: var(--card);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(15,23,42,0.08);
}

/* Forms */
.field { margin: 12px 0; }
label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--muted); }
input, textarea, select {
  width: 100%;
  border: 1px solid var(--input-border);
  border-radius: 10px;
  padding: 10px 12px;
  background: var(--input-bg);
  color: var(--text);
  outline: none;
  transition: all 0.15s ease;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15,118,110,0.2);
}

/* Modals & Overlays */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.7);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 16px;
  z-index: 100;
  animation: fadeIn 0.15s ease;
}
.modal-window {
  width: min(100%, 480px);
  max-height: 90vh;
  overflow-y: auto;
  background: var(--modal-bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow-lg);
  position: relative;
  animation: modalPop 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalPop { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: none; } }

/* Toast */
.toast-msg {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f172a;
  color: white;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 500;
  z-index: 200;
  box-shadow: var(--shadow-lg);
  max-width: 90%;
  text-align: center;
  animation: toastIn 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (min-width: 768px) {
  .toast-msg { bottom: 24px; }
}

/* Notice banners */
.banner {
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
}
.banner-info { background: var(--accent-blue-light); border: 1px solid var(--line); color: var(--accent-blue); }
.banner-warning { background: var(--accent-amber-light); border: 1px solid var(--line); color: var(--accent-amber); }
.banner-success { background: var(--primary-light); border: 1px solid var(--line); color: var(--primary); }

/* Empty state */
.empty-box {
  text-align: center;
  padding: 32px 16px;
  color: var(--muted);
  background: var(--box-bg);
  border-radius: 14px;
  border: 1px dashed var(--line);
}

/* Tables */
.table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }

/* Receipt Printable Styles */
.receipt-paper {
  background: #fff;
  color: #0f172a;
  border: 2px dashed #94a3b8;
  border-radius: 16px;
  padding: 24px;
  position: relative;
  overflow: hidden;
}
.receipt-paper::before {
  content: "OFFICIAL RECEIPT";
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #0f766e;
  border: 1px solid #0f766e;
  padding: 2px 6px;
  border-radius: 4px;
}
.receipt-paper.receipt-flash {
  animation: receiptFlash 0.78s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.receipt-paper.receipt-flash::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(112deg, transparent 22%, rgba(20, 184, 166, 0.14) 44%, rgba(255, 255, 255, 0.85) 50%, rgba(20, 184, 166, 0.14) 56%, transparent 78%);
  transform: translateX(-125%);
  animation: receiptSheen 0.78s cubic-bezier(0.22, 1, 0.36, 1) 0.04s both;
}
@keyframes receiptFlash {
  0% {
    opacity: 0.85;
    transform: scale(0.985);
    border-color: #14b8a6;
    box-shadow: 0 0 0 0 rgba(20, 184, 166, 0), 0 0 0 0 rgba(20, 184, 166, 0);
  }
  28% {
    opacity: 1;
    transform: scale(1.008);
    border-color: #0f766e;
    background: #f0fdfa;
    box-shadow: 0 0 0 5px rgba(20, 184, 166, 0.24), 0 12px 28px rgba(15, 118, 110, 0.16);
  }
  100% {
    opacity: 1;
    transform: scale(1);
    border-color: #94a3b8;
    background: #ffffff;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
  }
}
@keyframes receiptSheen {
  0% { transform: translateX(-125%); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateX(125%); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .receipt-paper.receipt-flash,
  .receipt-paper.receipt-flash::after,
  .member-item-enter,
  .member-item-new,
  .modal-window,
  .toast-msg,
  .view-fade,
  .fabmenu button {
    animation: none !important;
  }
}
@media print {
  body { padding: 0; background: white; color: black; }
  .top-header, .bottom-nav, .no-print, button, #toastRoot { display: none !important; }
  .modal-overlay { position: static; background: none; padding: 0; }
  .modal-window { width: 100%; max-height: none; box-shadow: none; padding: 0; border: none; }

  gap: 6px;

  border-radius: 99px;

.gchat-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--primary);
  animation: dmBlink 1.6s infinite;
}
.gchat-dot.off {
  background: var(--muted);
  animation: none;
}
.gchat-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 310px;

.gchat-meta {

  gap: 6px;

  font-weight: 700;
  margin-bottom: 2px;

.gchat-body {

.gchat-typing {
  min-height: 18px;

}
.gchat-form {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  align-items: center;
}
.gchat-form input {
  flex: 1;
  min-width: 0;
}
.gchat-form button {
  flex-shrink: 0;
  padding: 10px 16px;

/* ===== SIMPLE SINGLE-COLOUR APP DESIGN ===== */
body{padding-bottom:86px}
.toast-msg{display:flex;align-items:center;gap:8px;transition:opacity .3s,transform .3s;pointer-events:none}
.toast-msg.out{opacity:0;transform:translateX(-50%) translateY(8px)}
.toast-msg.bad{background:#be123c}
.toast-ic{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none;background:rgba(255,255,255,.25)}
.toast-msg.ok .toast-ic{background:#10b981}
/* Scroll down: top bar, bottom menu and + button slide away. Scroll up: they come back. */
.top-header,.bottom-nav{transition:transform .25s ease}
.fab{transition:transform .25s ease,opacity .25s ease,background .15s}
body.bars-hidden .top-header{transform:translateY(-110%)}
body.bars-hidden .bottom-nav{transform:translateY(110%)}
body.bars-hidden .fab:not(.open){transform:translateY(130px);opacity:0}
/* Notifications: tabs with counts, one card per alert (time on the left, View on the right) */
.ntabs{display:flex;gap:8px;margin:4px 0 12px;padding-top:8px;overflow-x:auto}
.ntab{position:relative;border:0;background:var(--box-bg);color:var(--muted);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.ntab.on{background:var(--primary-light);color:var(--primary-dark);box-shadow:inset 0 0 0 1.5px var(--primary)}
.nbadge{position:absolute;top:-7px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#f43f5e;color:#fff;font-size:11px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;cursor:pointer}
.nhead{display:flex;align-items:center;gap:10px;font-size:15.5px}
.nico{width:34px;height:34px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;flex:none}
.nbody{color:var(--muted);font-size:14px;line-height:1.5;margin:10px 0 12px}
.nfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
.nview{color:var(--primary);font-weight:700;font-size:14px}
.ncard:not(.read){border-left:4px solid var(--primary)}
.ncard.read{opacity:.62}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--primary);margin-left:auto;flex:none}
.nmark{background:none;border:0;color:var(--primary);font-weight:700;font-size:13px;padding:4px 2px}
.card{border-radius:20px;border:1px solid var(--line);box-shadow:none}
.top-header{padding:10px 0 12px}
.hd-left{display:flex;align-items:center;gap:11px;cursor:pointer;min-width:0;flex:1}
.hd-av{width:44px;height:44px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden;flex-shrink:0;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--primary)}
.hd-av img{width:100%;height:100%;object-fit:cover}
.hd-txt{min-width:0}.hd-hi{font-weight:800;font-size:18px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-biz{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.header-actions .btn-icon{width:42px;height:42px;border-radius:50%;background:var(--card)}
.bottom-nav .nav-item{font-size:11.5px}
.ic{display:block;flex-shrink:0}
.tiles{display:grid;gap:10px 4px;padding:14px 8px;margin-bottom:12px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}.tiles.t4{grid-template-columns:repeat(4,1fr)}
.tile{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;padding:6px 2px;border-radius:14px;line-height:1.2}
.tile:active{background:var(--box-bg)}.tile:focus-visible{outline:2px solid var(--primary)}
.tic{width:50px;height:50px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:grid;place-items:center}
.t3 .tic{width:58px;height:58px;border-radius:19px}
/* ===== HOME: records and progress ===== */
:root{--onp:#fff}[data-theme="dark"]{--onp:#04211f}
.home{padding-bottom:96px}
body:has(.home) #appFooter{display:none}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.sec a{color:var(--primary);cursor:pointer;font-weight:700;letter-spacing:0;padding:4px 2px}
.prog{display:flex;align-items:center;gap:16px;padding:16px 18px;margin-bottom:0}
.prog .pt{min-width:0}.prog .pt small{display:block;color:var(--muted);font-size:13px}
.prog .pt b{display:block;font-size:22px;letter-spacing:-.4px;margin:2px 0}
.ringw{position:relative;display:grid;place-items:center;flex-shrink:0}
.ringw>b{position:absolute;font-size:12.5px;font-weight:800;color:var(--text);display:grid;place-items:center}
.ringw>b .ic{color:var(--primary)}
.ring circle:nth-child(2){animation:ringIn .9s ease both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.att{padding:6px 14px}
.arow{display:flex;align-items:center;gap:12px;padding:12px 6px;margin:0 -6px;border-radius:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s ease}
.arow:hover{background:var(--box-bg)}
.arow:last-child{border-bottom:0}
.arow .aic{width:38px;height:38px;border-radius:13px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.arow .atx{flex:1;min-width:0}.arow .atx b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .atx small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow>.ic:last-child{color:var(--muted)}
.ok-row{display:flex;align-items:center;gap:10px;padding:14px 16px;color:var(--text);font-size:14.5px}.ok-row .ic{color:var(--primary)}
.rrow{display:flex;align-items:center;gap:14px;padding:13px 14px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s ease}
.rrow:hover{background:var(--box-bg)}
.rrow:first-child{border-radius:20px 20px 0 0}
.rrow:last-child{border-bottom:0;border-radius:0 0 20px 20px}
.rrow:only-child{border-radius:20px}
.rrow .rtx{flex:1;min-width:0}.rrow .rtx b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rtx small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.rrow>.ic{color:var(--muted)}
.rlist{padding:0;overflow:hidden}
.linkrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0 0;color:var(--primary);font-weight:700;font-size:14px;cursor:pointer;padding:10px;border-radius:12px;transition:background .15s ease}
.linkrow:hover{background:var(--primary-light)}
.empty-home{text-align:center;padding:28px 18px}.empty-home .tic{margin:0 auto 12px}.empty-home b{display:block;font-size:17px}.empty-home p{margin:6px 0 0;color:var(--muted)}
.dock{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),520px);bottom:calc(var(--navh,64px) + 8px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);z-index:45}
.dk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:11px 4px;min-height:60px;border-radius:16px;background:var(--box-bg);color:var(--text);border:0;font-size:12.5px;font-weight:700;min-width:0;line-height:1.15;text-align:center}
.dk.main{background:var(--primary);color:var(--onp)}
.dk span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:768px){.dock{bottom:18px}}
@media(prefers-reduced-motion:reduce){.ring circle:nth-child(2){animation:none}}

#tour .tspot:after{content:"";position:absolute;inset:-5px;border-radius:22px;border:2px solid #fff;animation:tpulse 1.4s infinite}
@keyframes tpulse{0%{transform:scale(.97);opacity:.95}100%{transform:scale(1.1);opacity:0}}
#tour .thand{position:absolute;pointer-events:none;color:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));animation:thand 1s ease-in-out infinite;transition:all .35s}
@keyframes thand{50%{transform:translate(-5px,-7px)}}
#tour .ttip{position:absolute;left:14px;right:14px;max-width:420px;margin:0 auto;background:var(--card);color:var(--text);border-radius:22px;padding:15px 16px;box-shadow:0 16px 44px rgba(0,0,0,.45);transition:top .35s cubic-bezier(.3,.8,.3,1)}
.ttip .th{display:flex;align-items:center;gap:12px}
.ttip .tic2{width:44px;height:44px;border-radius:15px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.ttip b{font-size:17px;display:block}.ttip small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.ttip .tf{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
.tdots{display:flex;gap:5px;align-items:center}.tdots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.25s}.tdots i.on{background:var(--primary);width:20px;border-radius:9px}
.tskip{background:transparent;border:0;color:var(--muted);padding:8px 6px;font-weight:600}
.tour-item{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tour-item:last-child{border-bottom:0}.tour-item .tic{width:42px;height:42px;border-radius:14px}
/* view switch, floating + button */
.rolesw{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 12px}
.rolesw small{color:var(--muted);font-size:12px}
.rolesw .rs{display:flex;background:var(--box-bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.rolesw .rs button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:9px;font-size:13px;font-weight:700}
.rolesw .rs button.on{background:var(--primary);color:var(--onp)}
.fabwrap{position:fixed;right:max(16px,calc(50% - 494px));bottom:calc(var(--navh,64px) + 16px);z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{width:56px;height:56px;border-radius:50%;padding:0;background:var(--primary);color:var(--onp);border:0;box-shadow:var(--shadow-lg);transition:transform .2s cubic-bezier(.22,1,.36,1),background .15s ease}

<script>

const SB_URL = 'https://ptcdywucfpbnocxlxoog.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0Y2R5d3VjZnBibm9jeGx4b29nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NDg3MzMsImV4cCI6MjEwODMyNDczM30.UQSzIfYXD5EOaypvzARTk3gWv1OGJf9kcxkP7XJKBuk';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// DATABASE SYNC: copies records, people and payments to Supabase so share links work on any phone
let loadingFor = null, loadedFor = null;

}
let idleTimer = null;
function idleMs() { if (!lockActive()) return 1800000; const a = lockAfter(); return a === 0 ? 300000 : Math.max(a, 60000); }
function startIdleLogout() {
  const reset = () => {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(async () => {
      if (!user || appLocked) return;
      if (lockActive()) { appLocked = true; lockAuto = false; closeModal(); render(); return; }

  ['click', 'keydown', 'touchstart', 'scroll', 'mousemove'].forEach(e => addEventListener(e, reset, { passive: true }));
  reset();
}

async function signInWithGoogle() {
  try { sessionStorage.setItem('rc_unlock_oauth', '1'); } catch (e) {}
  try {
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname, queryParams: { prompt: 'select_account' } } });

// APP LOCK (fingerprint / Face ID, or password only) + welcome screen
const SPLASH_TAGLINE = 'Simple records. Clear progress.';
let appLocked = false, hiddenAt = 0, lockAuto = false;
const b64u = {
  enc: b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: t => Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))

const isPublicHash = () => /^#\/(p|g|j|staff-invite)\/|^#\/(terms|privacy)$/.test(location.hash);
function lockCfg() { try { return JSON.parse(localStorage.getItem('rc_lock') || 'null'); } catch (e) { return null; } }
function saveLock(c) { try { c ? localStorage.setItem('rc_lock', JSON.stringify(c)) : localStorage.removeItem('rc_lock'); } catch (e) {} }
const lockActive = () => { const c = lockCfg(); return !!(user && c && c.uid === user.id); };
async function bioSupported() { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } }
const BRAND_MARK_SVG = '<svg viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="166" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="28"/><path d="M 256 90 A 166 166 0 1 1 100 199.2" fill="none" stroke="#5eead4" stroke-width="28" stroke-linecap="round"/><path d="M 206 334 V 178 H 266 A 42 42 0 0 1 266 262 H 206 M 258 262 L 312 334" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function showSplash() {
  if (document.getElementById('splash') || isPublicHash()) return;
  try { if (sessionStorage.getItem('rc_splash')) return; sessionStorage.setItem('rc_splash', '1'); } catch (e) {}
  const d = document.createElement('div'); d.id = 'splash';
  d.innerHTML = `<div class="sp-logo">${BRAND_MARK_SVG}</div><div class="sp-name">Recordly</div><div class="sp-tag">${esc(SPLASH_TAGLINE)}</div><div class="sp-dots"><i></i><i></i><i></i></div>`;
  document.body.appendChild(d);
}
function hideSplash(delay) { const d = document.getElementById('splash'); if (!d) return; setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 500); }, delay || 0); }
function maskId(u) {
  if (u.email) { const [a, d] = u.email.split('@'); return a.slice(0, 2) + '***@' + d; }
  const ph = u.phone || ''; return ph.length > 6 ? ph.slice(0, 3) + '****' + ph.slice(-3) : '';

let lockPin = '', pinFails = 0, pinBlockedUntil = 0;
const PIN_LEN = 6;
async function pinHash(pin, saltB64) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);

async function savePin(pin) {
  const salt = b64u.enc(crypto.getRandomValues(new Uint8Array(16)));
  const h = await pinHash(pin, salt);
  const c = lockCfg();
  saveLock({ ...(c && c.uid === user.id ? c : {}), uid: user.id, mode: (c && c.uid === user.id && c.mode) || 'pin', pin: { s: salt, h } });
}
function renderLock() {
  const c = lockCfg() || {}, bio = c.mode === 'bio' && !!c.cred, hasPin = !!c.pin;
  const m = user.user_metadata || {}, nm = m.name || m.full_name || 'Welcome back';
  const pic = m.avatar_url || m.picture;
  const fp = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11c0 3-.5 5.5-1.7 7.8"/><path d="M8.5 15.5c.4-1.3.5-2.6.5-4.5a3 3 0 0 1 6 0c0 1.2 0 2.3-.2 3.4"/><path d="M5.8 17.5C6.6 15.6 7 13.5 7 11a5 5 0 0 1 10 0c0 .8 0 1.6-.1 2.4"/><path d="M4 9a8 8 0 0 1 16 0c0 1.7-.1 3.3-.4 4.8"/><path d="M15.5 17.8c.3-.9.5-1.7.7-2.6"/></svg>';
  lockPin = '';
  $('app').innerHTML = `
    <div class="lockwrap">
      <div class="lk-brand"><div class="brand-icon">${BRAND_MARK_SVG}</div><div class="brand-text">Record<span>ly</span></div></div>
      <div class="lk-av">${pic ? `<img src="${esc(pic)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : esc((nm[0] || 'R').toUpperCase())}</div>

let groupChat = {
  rid: null,
  isOwner: false,
  chan: null,
  status: 'idle',
  msgs: [],
  ids: new Set(),
  online: [],
  typing: {},
  lastTypingSent: 0,
  dbMissing: false,
  allowed: true,
  loading: false
};

function chatDisplayName() {
  if (!user) return 'Guest';
  const m = user.user_metadata || {};
  return m.name || m.full_name || (user.email ? user.email.split('@')[0] : '') || user.phone || 'Member';
}

function closeGroupChat() {
  if (groupChat.chan) {
    try { sb.removeChannel(groupChat.chan); } catch (e) {}
  }
  Object.keys(groupChat.typing || {}).forEach(k => clearTimeout(groupChat.typing[k]?.timer));
  groupChat = {
    rid: null,
    isOwner: false,
    chan: null,
    status: 'idle',
    msgs: [],
    ids: new Set(),
    online: [],
    typing: {},
    lastTypingSent: 0,
    dbMissing: false,
    allowed: true,
    loading: false
  };
}

function addGroupChatMsg(raw) {
  if (!raw || !raw.id) return false;
  const id = String(raw.id);
  const idx = groupChat.msgs.findIndex(m => m.id === id);
  const normalized = {
    id,
    record_id: raw.record_id || groupChat.rid,
    author_id: raw.author_id || null,
    author_name: String(raw.author_name || raw.who || 'Member').slice(0, 60),
    body: String(raw.body || raw.msg || '').slice(0, 500),
    created_at: raw.created_at || new Date().toISOString(),
    pending: !!raw.pending
  };
  if (!normalized.body.trim()) return false;
  if (idx !== -1) {
    groupChat.msgs[idx] = Object.assign({}, groupChat.msgs[idx], normalized, { pending: !!raw.pending });
    return false;
  }
  groupChat.ids.add(id);
  groupChat.msgs.push(normalized);
  groupChat.msgs.sort((a, b) => (Date.parse(a.created_at) || 0) - (Date.parse(b.created_at) || 0));
  if (groupChat.msgs.length > 150) {
    groupChat.msgs = groupChat.msgs.slice(-150);
    groupChat.ids = new Set(groupChat.msgs.map(m => m.id));
  }
  return true;
}

function fmtChatTime(iso) {
  const d = new Date(iso || Date.now());
  return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function renderGroupChatFeed(scrollBottom) {
  const listEl = $('gchatList');
  if (listEl) {
    const wasNearBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 60;
    if (groupChat.loading && !groupChat.msgs.length) {
      listEl.innerHTML = '<div class="muted small" style="text-align:center;padding:24px 8px;">Loading messages…</div>';
    } else if (!groupChat.msgs.length) {
      listEl.innerHTML = '<div class="muted small" style="text-align:center;padding:24px 8px;">No messages yet. Start the conversation about contributions!</div>';
    } else {
      listEl.innerHTML = groupChat.msgs.map(m => {
        const mine = !!(user && m.author_id && m.author_id === user.id);
        return `
          <div class="gchat-msg${mine ? ' mine' : ''}${m.pending ? ' pending' : ''}">
            <div class="gchat-meta">
              <span>${esc(mine ? 'You' : m.author_name)}</span>
              <span>· ${esc(fmtChatTime(m.created_at))}${m.pending ? ' · sending…' : ''}</span>
            </div>
            <div class="gchat-body">${esc(m.body)}</div>
          </div>`;
      }).join('');
    }
    if (scrollBottom || wasNearBottom) listEl.scrollTop = listEl.scrollHeight;
  }
  const stEl = $('gchatStatus');
  if (stEl) {
    const n = groupChat.online.length;
    const live = groupChat.status === 'SUBSCRIBED';
    stEl.innerHTML = `<i class="gchat-dot${live ? '' : ' off'}"></i><span>${live ? (n > 1 ? n + ' online' : 'Live') : 'Connecting…'}</span>`;
  }
  const typEl = $('gchatTyping');
  if (typEl) {
    const names = Object.values(groupChat.typing).map(x => x.name).filter(Boolean);
    typEl.textContent = names.length ? (names.length === 1 ? names[0] + ' is typing…' : names.slice(0, 2).join(', ') + ' are typing…') : '';
  }
}

function notifyGroupChatTyping() {
  if (!groupChat.chan || groupChat.status !== 'SUBSCRIBED' || !user) return;
  const now = Date.now();
  if (now - groupChat.lastTypingSent < 1400) return;
  groupChat.lastTypingSent = now;
  try {
    groupChat.chan.send({
      type: 'broadcast',
      event: 'typing',
      payload: { uid: user.id, name: chatDisplayName() }
    });
  } catch (e) {}
}

async function sendGroupChatMsg() {
  if (!user || !groupChat.rid) return;
  const inp = $('gchatInput');
  const txt = (inp?.value || '').trim();
  if (!txt) return;
  const rid = groupChat.rid;
  const msgId = uid();
  const who = chatDisplayName();
  const optimistic = {
    id: msgId,
    record_id: rid,
    author_id: user.id,
    author_name: who,
    body: txt.slice(0, 500),
    created_at: new Date().toISOString(),
    pending: true
  };
  if (inp) inp.value = '';
  addGroupChatMsg(optimistic);
  renderGroupChatFeed(true);

  const btn = $('gchatSendBtn');
  if (btn) btn.disabled = true;
  try {
    let savedRow = null;
    if (UUID_RE.test(rid) && !groupChat.dbMissing) {
      let res = await sb.rpc('send_group_message', { rid, msg: optimistic.body, who, msg_id: msgId });
      if (res.error && groupChat.isOwner && /Not allowed/i.test(res.error.message || '') && typeof syncRecordsToDb === 'function') {
        await syncRecordsToDb().catch(() => {});
        res = await sb.rpc('send_group_message', { rid, msg: optimistic.body, who, msg_id: msgId });
      }
      if (res.error) {
        const em = String(res.error.message || '') + ' ' + String(res.error.code || '');
        if (/function|does not exist|schema cache|PGRST202|42P01/i.test(em)) {
          groupChat.dbMissing = true;
          optimistic.pending = false;
          addGroupChatMsg(optimistic);
          if (groupChat.chan && groupChat.status === 'SUBSCRIBED') {
            groupChat.chan.send({ type: 'broadcast', event: 'msg', payload: optimistic }).catch(() => {});
          }
          renderGroupChatBox();
          return;
        }
        throw res.error;
      }
      savedRow = res.data;
    }
    const finalMsg = savedRow ? Object.assign({}, savedRow, { pending: false }) : Object.assign({}, optimistic, { pending: false });
    addGroupChatMsg(finalMsg);
    if (groupChat.chan && groupChat.status === 'SUBSCRIBED') {
      groupChat.chan.send({ type: 'broadcast', event: 'msg', payload: finalMsg }).catch(() => {});
    }
    renderGroupChatFeed(true);
  } catch (e) {
    groupChat.msgs = groupChat.msgs.filter(m => m.id !== msgId);
    groupChat.ids.delete(msgId);
    if (inp && !inp.value) inp.value = txt;
    renderGroupChatFeed(false);
    toast(e?.message || 'Could not send message.');
  } finally {
    const b2 = $('gchatSendBtn');
    if (b2) b2.disabled = false;
  }
}

async function initGroupChat(rid, opts) {
  if (!rid) return;
  const sameRoom = groupChat.rid === rid && groupChat.chan;
  if (!sameRoom) {
    closeGroupChat();
    groupChat.rid = rid;
    groupChat.isOwner = !!(opts && opts.isOwner);
    groupChat.loading = !!(user && UUID_RE.test(rid));
    groupChat.allowed = !user ? false : (groupChat.isOwner || (Store.data.records || []).some(r => r.id === rid));
  }
  renderGroupChatBox();
  if (!user) return;

  if (!sameRoom && UUID_RE.test(rid)) {
    try {
      const { data, error } = await sb.rpc('get_group_messages', { rid });
      if (groupChat.rid !== rid) return;
      if (error) {
        const em = String(error.message || '') + ' ' + String(error.code || '');
        if (/function|does not exist|schema cache|PGRST202|42P01/i.test(em)) {
          groupChat.dbMissing = true;
          if (!groupChat.allowed) {
            const chk = await sb.from('people').select('id').eq('record_id', rid).eq('user_id', user.id).maybeSingle();
            if (groupChat.rid !== rid) return;
            groupChat.allowed = !!(chk && chk.data && chk.data.id);
          }
        }
      } else if (data === null) {
        groupChat.allowed = groupChat.isOwner;
      } else if (Array.isArray(data)) {
        groupChat.allowed = true;
        data.forEach(m => addGroupChatMsg(Object.assign({}, m, { pending: false })));
      }
    } catch (e) {}
    groupChat.loading = false;
    renderGroupChatBox();
    if (!groupChat.allowed) return;
  } else {
    groupChat.loading = false;
    groupChat.allowed = true;
    renderGroupChatBox();
  }

  if (sameRoom) return;

  const ch = sb.channel('group-chat-' + rid, {
    config: {
      broadcast: { self: false },
      presence: { key: user.id }
    }
  });
  groupChat.chan = ch;

  ch.on('broadcast', { event: 'msg' }, ({ payload }) => {
    if (groupChat.rid !== rid || !payload) return;
    const added = addGroupChatMsg(Object.assign({}, payload, { pending: false }));
    if (added) {
      if (payload.author_id !== user.id) playPing();
      renderGroupChatFeed(false);
    }
  });

  ch.on('broadcast', { event: 'typing' }, ({ payload }) => {
    if (groupChat.rid !== rid || !payload || !payload.uid || payload.uid === user.id) return;
    if (groupChat.typing[payload.uid]) clearTimeout(groupChat.typing[payload.uid].timer);
    groupChat.typing[payload.uid] = {
      name: String(payload.name || 'Someone').slice(0, 40),
      timer: setTimeout(() => {
        delete groupChat.typing[payload.uid];
        renderGroupChatFeed(false);
      }, 2400)
    };
    renderGroupChatFeed(false);
  });

  if (UUID_RE.test(rid)) {
    ch.on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'group_messages',
      filter: 'record_id=eq.' + rid
    }, m => {
      if (groupChat.rid !== rid || !m || !m.new) return;
      const added = addGroupChatMsg(Object.assign({}, m.new, { pending: false }));
      if (added && m.new.author_id !== user.id) playPing();
      renderGroupChatFeed(false);
    });
  }

  ch.on('presence', { event: 'sync' }, () => {
    if (groupChat.rid !== rid) return;
    const st = ch.presenceState() || {};
    groupChat.online = Object.keys(st).map(k => ({ uid: k, name: (st[k] && st[k][0] && st[k][0].name) || 'Member' }));
    renderGroupChatFeed(false);
  });

  ch.subscribe(status => {
    if (groupChat.rid !== rid) return;
    groupChat.status = status;
    if (status === 'SUBSCRIBED') {
      ch.track({ uid: user.id, name: chatDisplayName(), at: Date.now() }).catch(() => {});
    }
    renderGroupChatFeed(false);
  });
}

async function gateForgot() {

const DM_CAPS = ['Log payments in seconds', 'A private link per member', 'Instant receipts you can share', 'Sales, expenses and debts too', 'Joining needs admin approval'];
const DM_MS = [5200, 5000, 5200, 5000, 6200];
let dmTimer = null, dmIdx = -1, dmRaf = [];
function dmTween(el, from, to, ms, delay) {
  const t0 = performance.now() + delay;
  const step = now => {
    if (!el.isConnected) return;
    const k = Math.max(0, Math.min(1, (now - t0) / ms)), e = 1 - Math.pow(1 - k, 3);
    el.textContent = '₦' + Math.round(from + (to - from) * e).toLocaleString('en-NG');
    if (k < 1) dmRaf.push(requestAnimationFrame(step));
  };
  dmRaf.push(requestAnimationFrame(step));
}
function dmNext() {
  const root = $('dmRoot'); if (!root) { clearTimeout(dmTimer); return; }
  dmRaf.forEach(cancelAnimationFrame); dmRaf = [];
  dmIdx = (dmIdx + 1) % DM_CAPS.length;
  root.querySelectorAll('.dm-sl').forEach(x => x.classList.remove('on'));
  const el = root.querySelector('.dm-sl[data-i="' + dmIdx + '"]'); void el.offsetWidth; el.classList.add('on');
  $('dmCap').textContent = (dmIdx + 1) + ' · ' + DM_CAPS[dmIdx];
  root.querySelectorAll('#dmDots i').forEach((d, i) => d.classList.toggle('on', i === dmIdx));
  el.querySelectorAll('[data-count]').forEach(n => {
    const to = Number(n.dataset.count), ms = Number(n.dataset.ms || 1400), dl = Number(n.dataset.delay || 0);
    n.textContent = '₦0'; dmTween(n, 0, to, ms, dl);
    if (n.dataset.count2) dmTween(n, to, Number(n.dataset.count2), 800, Number(n.dataset.delay2 || 2800));
  });
  clearTimeout(dmTimer); dmTimer = setTimeout(dmNext, DM_MS[dmIdx]);
}
function startLandingDemo() { clearTimeout(dmTimer); dmIdx = -1; dmNext(); }

function animateLanding() {
  const pc = $('lpPct'), am = $('lpAmt'); if (!pc || !am) return;
  const t0 = performance.now(), D = 1700;
  const step = t => {
    if (!$('lpPct')) return;
    const k = Math.min(1, Math.max(0, (t - t0 - 350) / D)), e = 1 - Math.pow(1 - k, 3);
    pc.textContent = Math.round(84 * e) + '%';
    am.textContent = '₦' + Math.round(840000 * e).toLocaleString('en-NG');
    if (k < 1) requestAnimationFrame(step);
  };

}

function checkPlanQuota(kind, extraCount = 1, rec = null) {

  const curPlan = (myPlanInfo && myPlanInfo.plan) || 'free';
  const spec = PLAN_META[curPlan] || PLAN_META.free;
  if (kind === 'records') {
    const used = (Store.data.records || []).filter(r => !/^rec_/.test(r.id)).length;
    if (spec.groups !== Infinity && used + extraCount > spec.groups) {
      toast(`${spec.name} plan allows up to ${spec.groups} groups. Upgrade to add more.`, 'bad');
      openPlansModal();
      return false;
    }
  } else if (kind === 'members') {
    const current = rec ? (rec.people || []).length : 0;
    if (spec.members !== Infinity && current + extraCount > spec.members) {
      toast(`${spec.name} plan allows up to ${spec.members} members per group. Upgrade to add more.`, 'bad');
      openPlansModal();
      return false;
    }
  } else if (kind === 'staff') {
    const used = (teamMembersList || []).filter(t => t.status === 'active' || t.status === 'pending').length;
    if (used + extraCount > spec.staff) {
      toast(`${spec.name} plan allows ${spec.staff} staff accounts. Upgrade to invite staff.`, 'bad');
      openPlansModal();
      return false;
    }
  }
  return true;
}

  (async () => {

    if (proofPath && sb) {
      try {

        if (!error && data && data.signedUrl) url = data.signedUrl;
      } catch (e) {}
    }

      body.innerHTML = '<div class="empty-box">Proof file is not accessible on this device yet. Connect online to load it.</div>';

  })();

async function uploadPaymentProof(rid, pid, payId, file) {
  if (!file) return { path: null, preview: null };
  if (file.size > 5 * 1024 * 1024) {
    toast('Proof file must be 5MB or smaller.', 'bad');
    return { path: null, preview: null };
  }
  const preview = await new Promise(res => {
    if (!file.type.startsWith('image/') && file.type !== 'application/pdf') return res(null);
    if (file.size > 1.5 * 1024 * 1024 && file.type.startsWith('image/')) return res(null);
    const rd = new FileReader();
    rd.onload = () => res(String(rd.result || ''));
    rd.onerror = () => res(null);
    rd.readAsDataURL(file);
  });
  let path = null;
  if (user && sb) {
    try {
      const ext = ((file.name || '').split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
      const storagePath = `${rid}/${pid}/${payId}.${ext}`;
      const { error } = await sb.storage.from('payment-proofs').upload(storagePath, file, { upsert: true, contentType: file.type || 'image/png' });
      if (!error) path = storagePath;
    } catch (e) { console.warn('Proof storage upload notice:', e); }
  }
  return { path, preview };
}

function previewProofInput(input, prevId) {
  const f = input && input.files && input.files[0];
  const box = $(prevId);
  if (!box) return;
  if (!f) { box.innerHTML = ''; return; }
  if (f.size > 5 * 1024 * 1024) { toast('File must be 5MB or less.', 'bad'); input.value = ''; box.innerHTML = ''; return; }
  if (f.type.startsWith('image/')) {
    const url = URL.createObjectURL(f);
    box.innerHTML = `<div class="row" style="margin-top:8px;"><img class="proof-thumb" src="${url}" alt="Selected proof"><span class="small muted">${esc(f.name)}</span></div>`;
  } else {
    box.innerHTML = `<div class="small muted" style="margin-top:6px;">📎 ${esc(f.name)} (${Math.round(f.size / 1024)} KB)</div>`;
  }
}

async function submitEditPayment(rid, pid, payId) {
  const amt = Number(val('edPayAmt'));
  const paidOn = val('edPayDate') || localDate();
  const method = val('edPayMethod') || 'Cash';
  const note = val('edPayNote') || null;
  const reason = val('edPayReason');
  if (!amt || amt <= 0) { toast('Enter a valid amount.'); return; }
  if (!reason || reason.length < 3) { toast('Please provide a clear reason for editing this payment.'); return; }

  const r = findRec(rid), p = r && (r.people || []).find(x => x.id === pid), x = p && (p.payments || []).find(y => y.id === payId);
  if (!x) return;

  const proofFile = ($('edPayProof') && $('edPayProof').files && $('edPayProof').files[0]) || null;
  let proofPath = x.proof_path || null;
  if (proofFile) {
    const up = await uploadPaymentProof(rid, pid, payId, proofFile);
    if (up.path) proofPath = up.path;
    if (up.preview) x.proof_preview = up.preview;
  }

  const nowIso = new Date().toISOString();
  const entry = {
    action: 'edited',
    at: nowIso,
    by: myName(),
    reason,
    prev: { amount: Number(x.amount), paid_on: x.paid_on, method: x.method || 'Cash', note: x.note || null },
    next: { amount: amt, paid_on: paidOn, method, note }
  };
  x.change_log = Array.isArray(x.change_log) ? x.change_log.concat([entry]) : [entry];
  x.amount = amt;
  x.paid_on = paidOn;
  x.method = method;
  x.note = note;
  x.edited_at = nowIso;
  x.edit_reason = reason;
  if (proofPath) x.proof_path = proofPath;

  Store.save();
  try {
    await sb.rpc('rc_edit_payment', { pay_id: payId, new_amount: amt, new_paid_on: paidOn, new_method: method, new_note: note, reason_txt: reason });
    if (proofPath) await sb.from('payments').update({ proof_path: proofPath }).eq('id', payId);
  } catch (e) {}

  dispatchPushAlert({
    recipient_user_id: p.claimed_by || null,
    person_id: pid,
    record_id: rid,
    type: 'payment_edited',
    title: `Payment updated in ${r.title}`,
    body: `Updated to ${moneyReal(amt)} · Reason: ${reason}`,
    link: `#/p/${pid}`
  });

  closeModal();
  toast('Payment edited and logged to audit trail.');
  renderMemberAdmin(rid, pid);
}

// ===== BUYER DUE DATES & INSTALMENT SCHEDULES =====
function memberScheduleSummary(r, p) {
  const paid = paySum(p);
  const target = Number((r && r.target) || 0);
  const today = localDate();
  const plan = Array.isArray(p && p.installment_plan) ? p.installment_plan.slice().sort((a, b) => (a.due_date || '').localeCompare(b.due_date || '')) : [];
  let remainingPaid = paid;
  const rows = plan.map((item, idx) => {
    const amt = Number(item.amount || 0);
    const covered = Math.min(amt, Math.max(0, remainingPaid));
    remainingPaid = Math.max(0, remainingPaid - covered);
    const left = Math.max(0, amt - covered);
    const due = item.due_date || '';
    const isOver = left > 0 && !!due && due < today;
    const status = left <= 0 ? 'paid' : isOver ? 'overdue' : covered > 0 ? 'partial' : 'upcoming';
    return {
      id: item.id || ('inst_' + idx),
      label: item.label || ('Instalment ' + (idx + 1)),
      due_date: due,
      amount: amt,
      covered,
      remaining: left,
      status,
      overdue: isOver
    };
  });
  const nextRow = rows.find(x => x.remaining > 0) || null;
  let nextDue = null;
  if (nextRow) {
    const dl = nextRow.due_date ? daysUntil(nextRow.due_date) : null;
    nextDue = {
      label: nextRow.label,
      due_date: nextRow.due_date,
      amount: nextRow.remaining,
      totalAmount: nextRow.amount,
      overdue: dl !== null && dl < 0,
      daysOverdue: dl !== null && dl < 0 ? Math.abs(dl) : 0,
      daysLeft: dl
    };
  } else if (p && p.due_date && (target === 0 || paid < target)) {
    const bal = target > 0 ? Math.max(0, target - paid) : 0;
    const dl = daysUntil(p.due_date);
    nextDue = {
      label: 'Balance due',
      due_date: p.due_date,
      amount: bal,
      totalAmount: target,
      overdue: dl !== null && dl < 0,
      daysOverdue: dl !== null && dl < 0 ? Math.abs(dl) : 0,
      daysLeft: dl
    };
  } else if (r && r.end_date && !isRec(r) && target > 0 && paid < target) {
    const dl = daysUntil(r.end_date);
    if (dl !== null && dl < 0) {
      nextDue = {
        label: 'Group deadline',
        due_date: r.end_date,
        amount: Math.max(0, target - paid),
        totalAmount: target,
        overdue: true,
        daysOverdue: Math.abs(dl),
        daysLeft: dl
      };
    }
  }
  const overdue = !!(nextDue && nextDue.overdue);
  return { paid, target, balance: target ? Math.max(0, target - paid) : 0, rows, nextDue, overdue };
}

function generateInstallmentsPreview() {
  const n = Math.max(2, Math.min(24, Number(val('schCount')) || 3));
  const stepDays = Number(val('schEvery')) || 30;
  const total = Number(val('schTotal')) || 0;
  const baseAmt = total ? Math.floor((total / n) * 100) / 100 : 0;
  const rem = total ? Math.round((total - baseAmt * n) * 100) / 100 : 0;
  const startStr = val('schSingleDue') || localDate();
  const baseDate = new Date(startStr + 'T12:00:00');
  _schedDraft = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(baseDate.getTime());
    if (stepDays === 30) d.setMonth(d.getMonth() + i);
    else d.setDate(d.getDate() + stepDays * i);
    _schedDraft.push({
      id: uid(),
      label: `Instalment ${i + 1} of ${n}`,
      due_date: localDate(d),
      amount: i === n - 1 ? Math.round((baseAmt + rem) * 100) / 100 : baseAmt
    });
  }
  renderSchedDraftRows();
}

function collectSchedDraftInputs() {
  const rows = document.querySelectorAll('#schedDraftRows .sched-edit-row');
  if (!rows.length) return;
  _schedDraft = [...rows].map((row, idx) => ({
    id: row.dataset.id || uid(),
    label: (row.querySelector('.slbl')?.value || '').trim() || `Instalment ${idx + 1}`,
    due_date: (row.querySelector('.sdue')?.value || '').trim(),
    amount: Number((row.querySelector('.samt')?.value || '').replace(/,/g, '').trim()) || 0
  }));
}

function renderSchedDraftRows() {
  const box = $('schedDraftRows'); if (!box) return;
  if (!_schedDraft.length) {
    box.innerHTML = '<div class="muted small" style="padding:6px 2px;">No instalments configured. Leave empty to use only the single due date above.</div>';
    return;
  }
  box.innerHTML = _schedDraft.map((item, idx) => `
    <div class="sched-edit-row" data-id="${esc(item.id)}" style="display:grid;grid-template-columns:1.2fr 1fr .9fr auto;gap:6px;margin-bottom:6px;align-items:center;">
      <input class="slbl" value="${esc(item.label || '')}" placeholder="Label">
      <input class="sdue" type="date" value="${esc(item.due_date || '')}">
      <input class="samt" type="text" inputmode="decimal" data-money value="${esc(String(item.amount || ''))}" placeholder="₦">
      <button class="btn-outline btn-sm" onclick="collectSchedDraftInputs();_schedDraft.splice(${idx},1);renderSchedDraftRows()">✕</button>
    </div>
  `).join('');
}

function saveMemberSchedule(rid, pid) {
  collectSchedDraftInputs();
  const r = findRec(rid), p = r && (r.people || []).find(x => x.id === pid);
  if (!r || !p) return;
  p.due_date = val('schSingleDue') || null;

}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; ++i) out[i] = raw.charCodeAt(i);
  return out;
}

function getConfiguredVapidKey() {
  const meta = document.querySelector('meta[name="recordly-vapid-public-key"]');
  if (meta && meta.content) return meta.content.trim();
  if (window.RECORDLY_VAPID_PUBLIC_KEY) return String(window.RECORDLY_VAPID_PUBLIC_KEY).trim();
  try { return localStorage.getItem('rc_vapid_pub') || ''; } catch (e) { return ''; }
}

async function fetchVapidKeyFromSupabase() {
  if (!user || !sb || !navigator.onLine) return '';
  try {
    const { data, error } = await sb.functions.invoke('send-push-notification', { body: { action: 'vapid_key' } });
    const k = (!error && data && data.vapidPublicKey) ? String(data.vapidPublicKey).trim() : '';
    if (k) { try { localStorage.setItem('rc_vapid_pub', k); } catch (e) {} }
    return k;
  } catch (e) { return ''; }
}

async function subscribeWebPush(silent = false) {
  if (!user || !('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return false;
  if (Notification.permission !== 'granted') return false;
  let vapidKey = getConfiguredVapidKey();
  if (!vapidKey) vapidKey = await fetchVapidKeyFromSupabase();
  if (!vapidKey) return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(vapidKey) });
    }
    const json = sub.toJSON();
    await sb.from('push_subscriptions').upsert({
      user_id: user.id,
      endpoint: sub.endpoint,
      p256dh: (json.keys && json.keys.p256dh) || '',
      auth: (json.keys && json.keys.auth) || '',
      user_agent: navigator.userAgent.slice(0, 180)
    }, { onConflict: 'user_id,endpoint' });
    if (!silent) toast('Live Web Push notifications enabled on this device.');
    return true;
  } catch (e) {
    if (!silent) console.warn('Push subscription notice:', e);
    return false;
  }
}

async function readFnError(err) {
  if (!err) return 'Unknown error';
  try {
    const ctx = err.context;
    if (ctx && typeof ctx.clone === 'function') {
      const txt = await ctx.clone().text();
      try {
        const j = JSON.parse(txt);
        if (j && (j.error || j.message || j.msg)) return String(j.error || j.message || j.msg);
      } catch (_) {}
      if (txt) return txt.slice(0, 180);
    }
  } catch (_) {}
  return err.message || 'Check Edge Function setup';
}

async function sendBrevoEmail(payload) {
  if (!payload || !payload.toEmail) { toast('Buyer has no email address saved.'); return { ok: false }; }
  if (!user) { toast('Please sign in first to send emails.'); return { ok: false }; }
  if (!navigator.onLine) { toast('You are offline. Connect to the internet to send emails.'); return { ok: false }; }
  try {
    const { data, error } = await sb.functions.invoke('send-brevo-email', { body: payload });
    if (error) {
      const detail = await readFnError(error);
      throw new Error(detail);
    }
    if (data && data.error) throw new Error(data.error);
    return { ok: true, data };
  } catch (e) {
    const msg = (e && e.message) ? String(e.message) : 'Check Edge Function setup';
    const hint = /invalid jwt|jwt/i.test(msg)
      ? 'Invalid JWT at Supabase gateway — turn OFF "Verify JWT with legacy secret" on send-brevo-email.'
      : msg;
    toast('Could not send email via Brevo: ' + hint);
    return { ok: false, error: e, message: hint };
  }
}

          Store.data.records.push({ id: r.id, title: r.title, description: r.description || '', target: r.target, end_date: r.end_date, show_table: r.show_table, group_link: r.group_link, hide_balance: !!r.hide_balance, discoverable: !!r.discoverable, created_at: r.created_at, people: dbPeople });

          Object.assign(loc, { title: r.title, description: r.description || '', target: r.target, end_date: r.end_date, show_table: r.show_table, group_link: r.group_link, hide_balance: !!r.hide_balance, discoverable: !!r.discoverable });
          loc.people = loc.people || [];
          dbPeople.forEach(dp => {
            const lp = loc.people.find(x => x.id === dp.id);
            if (!lp) { loc.people.push(dp); return; }
            lp.name = dp.name; lp.phone = dp.phone || lp.phone;
            if (dp.email) lp.email = dp.email;
            if (dp.due_date) lp.due_date = dp.due_date;
            if (dp.installment_plan && dp.installment_plan.length) lp.installment_plan = dp.installment_plan;
            lp.payments = lp.payments || [];
            dp.payments.forEach(dx => {
              const lx = lp.payments.find(x => x.id === dx.id);
              if (!lx) lp.payments.push(dx);
              else Object.assign(lx, {
                amount: dx.amount, paid_on: dx.paid_on, method: dx.method, note: dx.note,
                edited_at: dx.edited_at, edit_reason: dx.edit_reason, voided: dx.voided,
                voided_at: dx.voided_at, void_reason: dx.void_reason, proof_path: dx.proof_path || lx.proof_path,
                change_log: (dx.change_log && dx.change_log.length) ? dx.change_log : (lx.change_log || [])
              });
            });
          });
        }
      });
    }
    try {
      const ex = await exP;
      if (!ex.error && ex.data) ex.data.forEach(x => {
        const loc = (Store.data.records || []).find(r => r.id === x.id);
        if (loc && !loc.freq && x.freq && x.freq !== 'once') { loc.freq = x.freq; loc.start = x.start_date || null; loc.period_amount = Number(x.period_amount) || null; }
      });
    } catch (e) {}
    try {
      const pr = await prP;
      if (!pr.error && pr.data) {
        if (!Store.data.settings) Store.data.settings = {};
        if (pr.data.searchable === false) Store.data.settings.hideFromSearch = true;
      }
    } catch (e) {}
    try {
      const rp = await rpP;
      if (!rp.error && Array.isArray(rp.data)) { paymentReports = rp.data; saveLocalReports(); }
    } catch (e) {}
    try {
      const bl = await blP;
      if (!bl.error && Array.isArray(bl.data)) { myBlocks = bl.data; saveLocalBlocks(); }
    } catch (e) {}
    const d = Store.data;
    if (!(d.customers.length || d.sales.length || d.expenses.length || d.debts.length)) {
      let b = null;
      try { const t = await sb.from('user_backups').select('backup').eq('user_id', user.id).maybeSingle(); if (t.data?.backup) b = t.data.backup; } catch (e) {}
      if (!b) b = (user.user_metadata && user.user_metadata.recordly_backup) || null;
      if (b) {
        ['customers', 'sales', 'expenses', 'debts'].forEach(k => { if (Array.isArray(b[k])) d[k] = b[k]; });
        if (b.settings) d.settings = Object.assign({}, d.settings, b.settings);
      }
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
  } catch (e) {
    console.warn('Could not load account data', e);
  }
  loadedFor = user ? user.id : null;
  try { if (user && localStorage.getItem('rc_newuser') === user.email) { localStorage.removeItem('rc_newuser'); setTimeout(() => startTour('welcome'), 900); } } catch (e) {}
  startLiveAlerts();
  startInboxLive();
  loadInbox();
  upsertProfile();
  loadMemberGroups();
  loadMyPlanUsage();
  loadTeamMembers();
  loadStaffWorkspacesAndRecords();
  setTimeout(maybeRequireTos, 450);
  if (remCfg().notify) subscribeWebPush(true);
  softRender();
}

async function syncRecordsToDb() {
  if (!user || loadedFor !== user.id) return;
  if (dbSyncBusy) { dbSyncAgain = true; return; }
  dbSyncBusy = true;
  try {
    applyRecurringAll();
    const recs = (Store.data.records || []).filter(r => !/^rec_/.test(r.id));
    let changed = false;
    recs.forEach(r => {
      if (!UUID_RE.test(r.id)) { r.id = uid(); changed = true; }
      (r.people || []).forEach(p => {
        if (!UUID_RE.test(p.id)) { p.id = uid(); changed = true; }
        (p.payments || []).forEach(x => { if (!UUID_RE.test(x.id)) { x.id = uid(); changed = true; } });
      });
    });
    if (changed) localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
    const today = localDate();
    const recRows = recs.map(r => ({ id: r.id, owner_id: user.id, title: r.title || 'Untitled', description: r.description || null, target: r.target ? Number(r.target) : null, end_date: r.end_date || null, show_table: !!r.show_table, group_link: !!r.group_link, hide_balance: !!r.hide_balance, discoverable: !!r.discoverable }));
    const peopleRows = [], payRows = [];
    recs.forEach(r => (r.people || []).forEach(p => {
      peopleRows.push({
        id: p.id, record_id: r.id, name: p.name || 'Member', phone: p.phone || null,
        email: p.email || null, due_date: p.due_date || null,
        installment_plan: Array.isArray(p.installment_plan) ? p.installment_plan : []
      });
      (p.payments || []).forEach(x => {
        if (Number(x.amount) > 0) {
          payRows.push({
            id: x.id, person_id: p.id, amount: Number(x.amount), paid_on: x.paid_on || today,
            note: x.note || null, paid_at: x.paid_at || null, method: x.method || null,
            payer_name: x.payer_name || null, payer_phone: x.payer_phone || null,
            logged_by: x.logged_by || user.id, edited_at: x.edited_at || null, edit_reason: x.edit_reason || null,
            voided: !!x.voided, voided_at: x.voided_at || null, void_reason: x.void_reason || null,
            proof_path: x.proof_path || null, change_log: Array.isArray(x.change_log) ? x.change_log : []
          });
        }
      });
    }));
    const sig = JSON.stringify([user.id, recRows, peopleRows, payRows]);
    if (sig !== dbSyncSig || changed) {
      await upsertSafe('records', recRows, ['hide_balance', 'discoverable']);
      if (recExtOk !== false) {
        const rr = recs.filter(isRec).map(r => ({ id: r.id, owner_id: user.id, title: r.title || 'Untitled', freq: r.freq, start_date: r.start || null, period_amount: Number(r.period_amount) || null }));
        if (rr.length) { try { const x = await sb.from('records').upsert(rr); if (x.error) recExtOk = false; } catch (e) { recExtOk = false; } }
      }
      await upsertSafe('people', peopleRows, ['email', 'due_date', 'installment_plan']);
      await upsertSafe('payments', payRows, ['paid_at', 'method', 'payer_name', 'payer_phone', 'logged_by', 'edited_at', 'edit_reason', 'voided', 'voided_at', 'void_reason', 'proof_path', 'change_log']);
      const sy = Object.assign({ r: [], p: [], x: [] }, Store.data.synced || {});
      const L = { r: new Set(recRows.map(a => a.id)), p: new Set(peopleRows.map(a => a.id)), x: new Set(payRows.map(a => a.id)) };
      const gone = k => sy[k].filter(id => !L[k].has(id));
      // Payments are never deleted from the app: use rc_void_payment (keeps the audit trail).
      const gp = gone('p'); if (gp.length) await sb.from('people').delete().in('id', gp);
      const gr = gone('r'); if (gr.length) await sb.from('records').delete().in('id', gr);
      Store.data.synced = { r: [...L.r], p: [...L.p], x: [...L.x] };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
      dbSyncSig = sig;
    }
    if (changed) softRender();
  } catch (e) {
    if (!handleDbPlanError(e)) {
      console.warn('Database sync problem', e);
      if (!dbSyncWarned) { dbSyncWarned = true; toast('Could not save online: ' + (e.message || e)); }
    }
  }
  dbSyncBusy = false;
  if (dbSyncAgain) { dbSyncAgain = false; scheduleDbSync(); }
}

// THEME ENGINE (Phone theme / Light / Dark / Pure black)
let currentTheme = 'light';      // what is actually shown: light | dark | black
let themePref = 'system';        // what the person chose: system | light | dark | black
const THEME_META = { light: '#0f766e', dark: '#0b0f19', black: '#000000' };
const THEME_OPTS = [
  ['system', 'Phone theme', 'Match your phone: light or dark automatically'],
  ['light', 'Light', 'Bright and clean'],
  ['dark', 'Dark', 'Dark blue-grey'],
  ['black', 'Pure black', 'True black. Saves battery on OLED screens']
];
const themeMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function resolveTheme(pref) {
  if (pref === 'system') return themeMQ && themeMQ.matches ? 'dark' : 'light';
  return THEME_META[pref] ? pref : 'light';
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('recordly_theme'); } catch (e) {}
  themePref = (saved === 'system' || THEME_META[saved]) ? saved : 'system';
  applyTheme(themePref);
  if (themeMQ) {
    const f = () => { if (themePref === 'system') applyTheme('system'); };
    if (themeMQ.addEventListener) themeMQ.addEventListener('change', f); else if (themeMQ.addListener) themeMQ.addListener(f);
  }
}

function applyTheme(pref) {
  themePref = (pref === 'system' || THEME_META[pref]) ? pref : 'system';
  currentTheme = resolveTheme(themePref);
  document.documentElement.setAttribute('data-theme', currentTheme);
  try { localStorage.setItem('recordly_theme', themePref); } catch (e) {}
  const iconEl = $('themeIcon');
  if (iconEl) iconEl.textContent = currentTheme === 'light' ? '🌙' : '☀️';
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', THEME_META[currentTheme]);
}

function toggleTheme() {
  applyTheme(currentTheme === 'light' ? 'dark' : 'light');
  toast(`Switched to ${currentTheme} mode`);
}
function themeLabel() {
  const o = THEME_OPTS.find(x => x[0] === themePref);
  return o ? o[1] : 'Phone theme';
}
function setThemePref(k) { applyTheme(k); openThemeSettings(); if (hash()[0] === 'settings') renderSettings(); }
function openThemeSettings() {
  $('modalRoot').innerHTML = miniModal('Theme', `
    <p class="muted" style="margin-top:0;">Choose how Recordly looks. "Phone theme" follows your phone's light or dark setting.</p>
    <div class="list">
      ${THEME_OPTS.map(o => {
        const on = themePref === o[0];
        return `<button class="${on ? 'btn-soft' : 'btn-outline'}" style="justify-content:space-between;padding:12px 14px;" onclick="setThemePref('${o[0]}')">
          <span style="text-align:left;"><b style="display:block;">${esc(o[1])}</b><span class="small muted">${esc(o[2])}</span></span>
          <span>${on ? '✓' : ''}</span>
        </button>`;
      }).join('')}
    </div>
  `);
}
