    ${people.length ? `<div class="card"><div class="card-title">🙂 People (${people.length})</div><div class="list" style="margin-top:10px;">${people.map(p => {
      const gs = groups.filter(g => g.owner_id === p.id);
      return `<div class="item-card" style="flex-direction:column;align-items:stretch;gap:8px;"><div class="row"><div class="avatar-circle">${esc((p.display_name || '?').slice(0, 1).toUpperCase())}</div><div class="grow"><b>${esc(p.display_name)}</b>${gs.length ? `<div class="row" style="margin-top:6px;">${gs.map(g => `<button class="btn-soft btn-sm" onclick="location.hash='#/j/${g.id}/search'">${esc(g.title)} ›</button>`).join('')}</div>` : `<div class="muted small">No public groups yet.</div>`}</div></div><div class="row" style="gap:6px;"><button class="btn-outline btn-sm" onclick="blockEntity({user_id:'${p.id}',label:'${esc(p.display_name)}'})">Block person</button><button class="btn-outline btn-sm" onclick="openReportGroupModal('','${esc(p.display_name)}','${p.id}')">Report</button></div></div>`;
    }).join('')}</div></div>` : ''}
    ${!groups.length && !people.length ? '<div class="empty-box">Nothing found. Groups only appear here when their admin turns on "Show in Recordly search", and users who hide from search stay unlisted.</div>' : ''}`;
}


// ---- Fixed page bar (back button + current page name) ----
const PB_TITLES = { contributions: 'Contributions', business: 'Business', debts: 'Debts', reports: 'Reports', more: 'Me', settings: 'Settings', profile: 'My Profile', notifications: 'Notifications', discover: 'Find people & groups', r: 'Record', p: 'Payment progress', g: 'Group', j: 'Join group', 'staff-invite': 'Staff invite', terms: 'Terms of Service', privacy: 'Privacy Policy' };
const PB_PARENT = { settings: '#/more', profile: '#/more', r: '#/contributions' };
let navIdx = 0;
try {
  if (history.state && typeof history.state.idx === 'number') navIdx = history.state.idx;
  else history.replaceState(Object.assign({}, history.state || {}, { idx: 0 }), '');
} catch (e) {}
window.addEventListener('hashchange', () => {
  const st = history.state;
  if (st && typeof st.idx === 'number') navIdx = st.idx;          // back / forward: entry already numbered
  else { navIdx += 1; try { history.replaceState({ idx: navIdx }, ''); } catch (e) {} }  // new page opened
});
function pageBack() {
  if (navIdx > 0) { history.back(); return; }                     // go to the page you came from
  const p = hash();                                               // opened directly (shared link etc.)
  let to = '#/';
  if (p[0] === 'contributions' && p[1] === 'new') to = '#/contributions';
  else if (p[0] === 'r' && p[2]) to = '#/r/' + p[1];
  else if (PB_PARENT[p[0]]) to = PB_PARENT[p[0]];
  location.hash = to;
}
function updatePageBar(p) {
  const pub = ['p', 'g', 'j', 'staff-invite', 'terms', 'privacy'].includes(p[0]);
  const show = p.length > 0 && !appLocked && (user || pub);
  document.body.classList.toggle('has-pagebar', !!show);
  if (!show) return;
  let title = PB_TITLES[p[0]] || '';
  if (p[0] === 'contributions' && p[1] === 'new') title = 'New record';
  if (p[0] === 'r' && p[2]) title = 'Member';
  const b = document.querySelector('#pageBar .pb-back'); if (b && !b.firstChild) b.innerHTML = ico('back', 20);
  const el = $('pbTitle'); if (el) el.textContent = title;
}

let _lastRouteKey = null;

async function renderCore() {
  try { applyRecurringAll(); } catch (e) {}
  setTop();
  applyRoleNav();
  scheduleDbSync();
  try {
    const p = hash();
    const routeKey = p.join('/');
    const routeChanged = _lastRouteKey !== null && _lastRouteKey !== routeKey;
    _lastRouteKey = routeKey;
    if (user && viewRole() === 'member') updateNavActive(p[0] === 'discover' ? 'contributions' : p[0] === 'notifications' ? 'business' : /^(more|profile|settings)$/.test(p[0] || '') ? 'more' : 'home');
    const onGroupView = (p[0] === 'r' && p[1] && !p[2]) || (p[0] === 'g' && p[1]);
    if (!onGroupView || groupChat.rid !== p[1]) closeGroupChat();
    document.body.classList.toggle('sub-page', p.length > 0);
    updatePageBar(p);   // the greeting row shows on Home only
    let res;
    if (p[0] === 'p' && p[1]) res = await renderPublicPerson(p[1], p[2]);
    else if (p[0] === 'g' && p[1]) res = await renderPublicGroup(p[1], p[2]);
    else if (p[0] === 'j' && p[1]) res = await renderJoinPage(p[1], p[2]);
    else if (p[0] === 'staff-invite' && p[1]) res = await renderStaffInviteRoute(p[1]);
    else if (p[0] === 'terms' || p[0] === 'privacy') { $('app').innerHTML = `<div class="card empty-box"><h2>${p[0] === 'terms' ? 'Terms of Service' : 'Privacy Policy'}</h2><p class="muted">Review Recordly's legal terms and data privacy commitments.</p><div class="row" style="justify-content:center;gap:8px;margin-top:10px;"><button class="btn-primary" onclick="openLegalDoc('${p[0]}')">Read Here</button><a class="btn-outline" href="${p[0]}.html" target="_blank" rel="noopener">Open Standalone Page</a></div></div>`; }
    else if (!user) res = renderLoggedOut();
    else if (appLocked) res = renderLock();
    else if (p[0] === 'discover') res = renderDiscover();
    else if (p[0] === 'contributions') {
      if (p[1] === 'new') res = newRecordForm();
      else res = renderContributions();
    } else if (p[0] === 'r' && p[1]) {
      if (p[2]) res = renderMemberAdmin(p[1], p[2]);
      else res = renderRecordDetail(p[1]);
    } else if (p[0] === 'business') res = renderBusiness();
    else if (p[0] === 'debts') res = renderDebts();
    else if (p[0] === 'reports') res = renderReports();
    else if (p[0] === 'more') res = renderMore();
    else if (p[0] === 'settings') res = renderSettings();
    else if (p[0] === 'profile') res = renderProfile();
    else if (p[0] === 'notifications') res = renderNotifications();
    else res = renderDashboard();

    if (routeChanged) {
      window.scrollTo(0, 0);
      const appEl = $('app');
      if (appEl) {
        appEl.classList.remove('view-fade');
        void appEl.offsetWidth;
        appEl.classList.add('view-fade');
      }
    }
    return res;
  } catch (e) {
    console.error('Render error:', e);
    $('app').innerHTML = `
      <div class="card empty-box">
        <h2>Something went wrong</h2>
        <p class="muted">${esc(e.message || String(e))}</p>
        <button class="btn-primary" onclick="location.hash='#/'">Go to Dashboard</button>
      </div>
    `;
  }
}

// MONEY INPUTS: commas appear as you type (1,234,567.50); the keypad is numeric; saving still gets the plain number.
const fmtNum = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
function fmtMoneyEl(el) {
  const old = el.value; let caret = el.selectionStart;
  if (caret === null || caret === undefined) caret = old.length;
  const parts = old.replace(/[^\d.]/g, '').split('.');
  let int = parts[0].replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const out = parts.length > 1 ? (int || '0') + '.' + parts.slice(1).join('').slice(0, 2) : int;
  if (out === old) return;
  const keep = old.slice(0, caret).replace(/[^\d.]/g, '').length;
  el.value = out;
  let pos = 0, n = 0;
  while (pos < out.length && n < keep) { if (/[\d.]/.test(out[pos])) n++; pos++; }
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}
function initMoneyInputs() {
  document.addEventListener('input', e => { const t = e.target; if (t && t.dataset && t.dataset.money !== undefined) fmtMoneyEl(t); }, true);
  const fresh = () => document.querySelectorAll('[data-money]:not([data-mf])').forEach(el => { el.setAttribute('data-mf', '1'); if (el.value) fmtMoneyEl(el); });
  const mo = new MutationObserver(fresh);
  ['app', 'modalRoot'].forEach(id => { const n = $(id); if (n) mo.observe(n, { childList: true, subtree: true }); });
  fresh();
}

function initUxEnhancements() {
  // 1. Auto-attach clear (✕) button to every .search-input box
  const enhanceSearch = () => {
    document.querySelectorAll('.search-input:not([data-sc])').forEach(wrap => {
      wrap.setAttribute('data-sc', '1');
      const inp = wrap.querySelector('input');
      if (!inp) return;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'search-clear';
      btn.setAttribute('aria-label', 'Clear search');
      btn.textContent = '✕';
      const sync = () => btn.classList.toggle('show', !!inp.value.trim());
      inp.addEventListener('input', sync);
      btn.addEventListener('click', () => {
        inp.value = '';
        sync();
        inp.dispatchEvent(new Event('input', { bubbles: true }));
        inp.focus();
      });
      wrap.appendChild(btn);
      sync();
    });
  };
  const moApp = new MutationObserver(enhanceSearch);
  ['app', 'modalRoot'].forEach(id => { const n = $(id); if (n) moApp.observe(n, { childList: true, subtree: true }); });
  enhanceSearch();

  // 2. Sync body scroll-lock whenever a modal opens or closes
  const mr = $('modalRoot');
  if (mr) {
    const moModal = new MutationObserver(() => {
      document.body.classList.toggle('modal-open', mr.children.length > 0);
    });
    moModal.observe(mr, { childList: true });
  }

  // 3. Global keyboard shortcuts: Escape closes modals/FAB/tour; Cmd/Ctrl+K opens search
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('modalRoot') && $('modalRoot').children.length) { closeModal(); return; }
      const dock = $('homeDock');
      if (dock && dock.classList.contains('open')) { toggleFab(); return; }
      if (typeof tour !== 'undefined' && tour) { endTour(); return; }
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      if (user && !appLocked && !isPublicHash()) {
        e.preventDefault();
        openGlobalSearch();
      }
    }
  });
}

async function start() {
  showSplash();
  const splashAt = Date.now();
  initTheme();
  updateMaskIcon();
  initFit();
  initMoneyInputs();
  initUxEnhancements();
  Store.init();

  try {
    const { data } = await sb.auth.getSession();
    user = data?.session?.user || null;
    if (!user && !navigator.onLine) {
      // No internet and no usable session: let the person in with their saved PIN so they can still work.
      try { const c = lockCfg(), last = JSON.parse(localStorage.getItem('rc_lastuser') || 'null'); if (c && c.pin && last && c.uid === last.id) { user = last; offlineSession = true; } } catch (e) {}
    }
    try { if (lockActive() && !isPublicHash() && !sessionStorage.getItem('rc_unlock_oauth') && (lockAfter() === 0 || Date.now() - Number(localStorage.getItem('rc_lastactive') || 0) >= lockAfter())) appLocked = true; sessionStorage.removeItem('rc_unlock_oauth'); } catch (e) {}
    sb.auth.onAuthStateChange((event, session) => {
      const prev = user;
      user = session?.user || null;
      if (event === 'PASSWORD_RECOVERY') { setTop(); render(); authModal('set_new_password'); return; }
      // Token refreshes, profile/backup updates and tab re-focus fire this event too.
      // Only restart the screen when the signed-in person actually changes.
      if ((prev?.id || null) === (user?.id || null) && event !== 'SIGNED_OUT') return;
      try { if (user && event === 'SIGNED_IN' && user.app_metadata?.provider === 'google' && user.email && Date.now() - new Date(user.created_at).getTime() < 120000) localStorage.setItem('rc_newuser', user.email); } catch (e) {}
      setTop();
      render();
      if (user) {
        loadAccountData().then(() => syncLocalDataToSupabase({ silent: true }));
      }
    });
  } catch (e) {
    console.warn('Supabase auth offline fallback:', e);
  }

  // Start periodic cloud sync every 45 seconds
  startPeriodicCloudSync(45000);
  startIdleLogout();
  startActiveTracker();

  // Sync when browser reconnects to internet
  window.addEventListener('online', async () => {
    if (offlineSession) {
      try { const { data } = await sb.auth.getSession(); if (data?.session?.user) { user = data.session.user; offlineSession = false; toast('Back online. Syncing your records…'); } else { toast('Back online. Please log in again to sync your records.'); return; } } catch (e) { return; }
    }
    syncLocalDataToSupabase({ silent: true });
  });

  // Show the app straight away from the data saved on this phone, then refresh from the server in the background.
  // Only wait for the server when the saved data belongs to a different account (or there is none).
  let bgLoad = null;
  if (user) {
    if (Store.data.owner === user.id) { bgLoad = loadAccountData(); }
    else await loadAccountData();
  }
  window.addEventListener('hashchange', render);
  await render();
  hideSplash(Math.max(0, 500 - (Date.now() - splashAt)));
  if (bgLoad) bgLoad.then(() => syncLocalDataToSupabase({ silent: true }));
  setTimeout(maybeOfferLock, 2600);

  if (user) {
    syncLocalDataToSupabase({ silent: true });
  }
}

// INSTALL AS AN APP (home-screen install + offline shell)
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; const b = $('installRow'); if (b) b.style.display = ''; });
window.addEventListener('appinstalled', () => { installPrompt = null; const b = $('installRow'); if (b) b.style.display = 'none'; toast('Recordly is installed on your phone.'); });
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
async function installApp() {
  if (installPrompt) { installPrompt.prompt(); try { await installPrompt.userChoice; } catch (e) {} installPrompt = null; return; }
  toast('Open your browser menu (⋮) and tap "Install app" or "Add to Home screen".');
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

(function () {
  let lastY = window.scrollY || 0, busy = false;
  const setHidden = h => document.body.classList.toggle('bars-hidden', h);
  window.addEventListener('scroll', () => {
    if (busy) return; busy = true;
    requestAnimationFrame(() => {
      busy = false;
      const m = $('modalRoot'); if (m && m.innerHTML.trim()) return;
      const y = window.scrollY || 0, d = y - lastY;
      if (y < 60) setHidden(false);
      else if (d > 8) setHidden(true);
      else if (d < -8) setHidden(false);
      if (Math.abs(d) > 8) lastY = y;
    });
  }, { passive: true });
  window.addEventListener('hashchange', () => { setHidden(false); lastY = 0; });
})();

start();
</script>
