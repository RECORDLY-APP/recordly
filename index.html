/**
 * SUPABASE CLOUD BACKUP & PERIODIC SYNC ENGINE
 */
let lastBackupSig = '';
let cloudSyncStatus = 'idle'; // 'idle', 'syncing', 'synced', 'error', 'offline_local'
let lastCloudSyncTime = localStorage.getItem('recordly_last_sync') || null;
let syncDebounceTimer = null;
let periodicSyncTimer = null;

function scheduleDebouncedCloudSync() {
  if (syncDebounceTimer) clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(() => {
    syncLocalDataToSupabase({ silent: true });
  }, 2500);
}

function startPeriodicCloudSync(intervalMs = 45000) {
  if (periodicSyncTimer) clearInterval(periodicSyncTimer);
  periodicSyncTimer = setInterval(() => {
    syncLocalDataToSupabase({ silent: true });
  }, intervalMs);
}

async function syncLocalDataToSupabase(options = { silent: true }) {
  if (!user) {
    cloudSyncStatus = 'offline_local';
    updateSyncStatusBadge();
    if (!options.silent) {
      toast('Sign in with Supabase to enable cloud backup.');
      authModal('login');
    }
    return;
  }
  if (loadedFor !== user.id) return; // wait until this account's data has been loaded

  cloudSyncStatus = 'syncing';
  updateSyncStatusBadge();

  try {
    const rawData = localStorage.getItem(STORAGE_KEY) || JSON.stringify(Store.data);
    const parsed = JSON.parse(rawData);
    const syncTimestamp = new Date().toISOString();

    const backupPayload = {
      records: parsed.records || [],
      customers: parsed.customers || [],
      sales: parsed.sales || [],
      expenses: parsed.expenses || [],
      debts: parsed.debts || [],
      settings: parsed.settings || {},
      version: 'v2',
      updated_at: syncTimestamp
    };

    const bsig = JSON.stringify([backupPayload.records, backupPayload.customers, backupPayload.sales, backupPayload.expenses, backupPayload.debts, backupPayload.settings]);
    if (bsig === lastBackupSig) { cloudSyncStatus = 'synced'; updateSyncStatusBadge(); return; }

    // Backup goes to the user_backups table. Auth user metadata is copied into the login token
    // sent with every request, so a big backup there makes the whole app slow.
    let tableOk = false;
    try {
      const up = await sb.from('user_backups').upsert({
        user_id: user.id,
        backup: backupPayload,
        updated_at: syncTimestamp
      }, { onConflict: 'user_id' });
      tableOk = !up.error;
    } catch (tblErr) {}

    if (tableOk) {
      // Table backup works: remove any old big backup from the login metadata (once).
      if (user.user_metadata && user.user_metadata.recordly_backup) {
        try {
          const r = await sb.auth.updateUser({ data: { recordly_backup: null } });
          if (r && r.data && r.data.user) user = r.data.user;
        } catch (e) {}
      }
    } else {
      // No backup table yet: keep the old metadata backup so nothing is lost.
      const { error: updateError } = await sb.auth.updateUser({
        data: { recordly_backup: backupPayload, recordly_last_synced: syncTimestamp }
      });
      if (updateError) console.warn('Supabase auth metadata backup notice:', updateError);
    }

    lastBackupSig = bsig;
    cloudSyncStatus = 'synced';
    lastCloudSyncTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    localStorage.setItem('recordly_last_sync', lastCloudSyncTime);

    if (!options.silent) {
      toast(`Cloud backup synced to Supabase (${lastCloudSyncTime})!`);
      if (currentTab === 'more') renderMore();
    }
    updateSyncStatusBadge();
  } catch (err) {
    console.error('Cloud sync failure:', err);
    cloudSyncStatus = 'error';
    updateSyncStatusBadge();
    if (!options.silent) {
      toast('Cloud sync failed: ' + (err.message || 'Network error'));
    }
  }
}

async function restoreFromSupabaseBackup() {
  if (!user) {
    toast('Please sign in to restore your cloud backup.');
    authModal('login');
    return;
  }

  toast('Checking cloud backup on Supabase...');
  try {
    const { data: userData } = await sb.auth.getUser();
    let backup = userData?.user?.user_metadata?.recordly_backup || user?.user_metadata?.recordly_backup;

    if (!backup) {
      try {
        const { data: tblData } = await sb.from('user_backups').select('backup').eq('user_id', user.id).single();
        if (tblData?.backup) backup = tblData.backup;
      } catch (e) {}
    }

    if (!backup) {
      toast('No cloud backup found on your Supabase account.');
      return;
    }

    const recCount = (backup.records || []).length;
    const custCount = (backup.customers || []).length;
    const salesCount = (backup.sales || []).length;
    const debtCount = (backup.debts || []).length;
    const backupDate = backup.updated_at ? new Date(backup.updated_at).toLocaleString() : 'Recent';

    if (confirm(`Cloud backup found from ${backupDate}:\n• ${recCount} Groups\n• ${custCount} Customers\n• ${salesCount} Sales\n• ${debtCount} Debts\n\nRestore this cloud backup to your device?`)) {
      Store.data = {
        records: backup.records || [],
        customers: backup.customers || [],
        sales: backup.sales || [],
        expenses: backup.expenses || [],
        debts: backup.debts || [],
        settings: backup.settings || { businessName: 'My Enterprise', onboarded: true }
      };
      Store.save();
      toast('Cloud backup restored successfully!');
      render();
    }
  } catch (err) {
    toast('Restore failed: ' + (err.message || 'Error'));
  }
}

function updateSyncStatusBadge() {
  const badge = $('cloudSyncBadge');
  if (!badge) return;
  if (!user) {
    badge.className = 'badge badge-gray';
    badge.innerHTML = '☁️ Local';
    badge.title = 'Local only. Sign in to backup to Supabase';
  } else if (cloudSyncStatus === 'syncing') {
    badge.className = 'badge badge-amber';
    badge.innerHTML = '☁️ Syncing...';
    badge.title = 'Backing up to Supabase';
  } else if (cloudSyncStatus === 'error') {
    badge.className = 'badge badge-red';
    badge.innerHTML = '☁️ Sync Error';
    badge.title = 'Last backup attempt failed';
  } else {
    badge.className = 'badge badge-green';
    badge.innerHTML = `☁️ Synced ${lastCloudSyncTime ? lastCloudSyncTime.slice(0, 5) : ''}`;
    badge.title = `Auto-sync active. Last synced: ${lastCloudSyncTime || 'Just now'}`;
  }
}

let user = null;
let currentTab = 'home';

let toastTimer = null, toastFade = null;
// Pop-up message: green tick for success, red for problems, dark for info. Gone after exactly 3 seconds.
function toast(msg, kind) {
  clearTimeout(toastTimer); clearTimeout(toastFade);
  const root = $('toastRoot');
  if (!root) return;
  const txt = String(msg);
  const k = kind || (/\b(fail|failed|error|could not|couldn't|can't|cannot|not allowed|invalid|wrong)\b/i.test(txt) ? 'bad'
    : /\b(added|saved|recorded|created|updated|deleted|sent|copied|imported|marked|installed|approved|logged|ready)\b/i.test(txt) ? 'ok' : '');
  root.innerHTML = `<div class="toast-msg ${k}" role="status" aria-live="polite">${k ? `<span class="toast-ic">${k === 'bad' ? '!' : '✓'}</span>` : ''}${esc(txt)}</div>`;
  toastFade = setTimeout(() => { const t = root.firstElementChild; if (t) t.classList.add('out'); }, 2700);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 3000);

// Read = the person opened that notification. Seen = it was on screen the last time the bell was opened.
let readIds = new Set(), seenIds = new Set();
try { readIds = new Set(JSON.parse(localStorage.getItem('rc_read') || '[]')); seenIds = new Set(JSON.parse(localStorage.getItem('rc_seen') || '[]')); } catch (e) {}
function saveNotifState() { try { localStorage.setItem('rc_read', JSON.stringify([...readIds].slice(-400))); localStorage.setItem('rc_seen', JSON.stringify([...seenIds].slice(-400))); } catch (e) {} }
function notifId(n) { return n.id || (n.type + '|' + n.title + '|' + (n.desc || '')); }
function isRead(n) { return readIds.has(notifId(n)); }
function checkReminders() {
  const notifs = liveAlerts.map(a => ({ type: 'info', title: a.title, desc: a.desc, link: a.link, at: a.at, id: a.key ? 'k' + a.key : 'a' + a.at }));
  const now = new Date();
  const todayStr = now.toISOString().slice(0, 10);

  // 1. Open payment problem reports
  (paymentReports || []).filter(rp => rp.status === 'open').forEach(rp => {
    let link = '#/notifications', who = rp.reporter_name || 'Buyer';
    activeRecords().forEach(r => {
      const p = (r.people || []).find(x => x.id === rp.person_id);
      if (p) { link = `#/r/${r.id}/${p.id}`; who = p.name; }
    });
    notifs.push({
      id: 'pr_' + rp.id,
      type: 'danger',
      title: `Payment flagged by ${who}`,
      desc: `${rp.reason}${rp.expected_amount ? ' · Expected ' + moneyReal(rp.expected_amount) : ''}${rp.details ? ' · ' + rp.details : ''}`,
      link
    });
  });

  // 2. Overdue debts
  Store.data.debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    const balance = Number(d.original_amount || 0) - repaid;
    if (balance > 0 && d.due_date && d.due_date < todayStr) {
      notifs.push({
        type: 'danger',
        title: `Overdue ${d.type === 'receivable' ? 'Receivable' : 'Payable'}: ${d.person_name}`,
        desc: `${money(balance)} was due on ${d.due_date}.`,
        link: '#/debts'
      });
    }
  });

  // 3. Overdue & upcoming buyer due dates / instalments + group deadlines
  activeRecords().forEach(r => {
    (r.people || []).forEach(p => {
      const sched = memberScheduleSummary(r, p);
      if (sched.nextDue && sched.nextDue.overdue) {
        notifs.push({
          id: 'ov_' + p.id + '_' + sched.nextDue.due_date,
          type: 'danger',
          title: `Overdue instalment: ${p.name}`,
          desc: `${r.title} · ${sched.nextDue.label} was due ${sched.nextDue.due_date}${sched.nextDue.amount ? ' (' + moneyReal(sched.nextDue.amount) + ')' : ''}.`,
          link: `#/r/${r.id}/${p.id}`
        });
      }
    });
    if (r.end_date && !isRec(r)) {
      const diffDays = Math.ceil((new Date(r.end_date) - now) / (1000 * 60 * 60 * 24));
      if (diffDays >= 0 && diffDays <= 7) {
        notifs.push({
          type: 'warning',
          title: `Deadline Approaching: ${r.title}`,
          desc: `Closes in ${diffDays === 0 ? 'today' : diffDays + ' days'} (${r.end_date}).`,
          link: `#/r/${r.id}`
        });
      }
    }
  });

  const badge = $('notifCountBadge');
  if (badge) {
    const fresh = notifs.some(n => !seenIds.has(notifId(n))) || (inbox.joins || []).some(j => j.status === 'pending' && !seenIds.has('join:' + j.id));
    badge.style.display = fresh ? 'block' : 'none';
  }

  return notifs;
}

      }

async function resendOtp() {

function executeGlobalSearch() {
  const q = val('globalSearchInput').toLowerCase();
  const resEl = $('globalSearchResults');
  if (!q) {
    resEl.innerHTML = `<p class="muted small" style="text-align:center;padding:20px 0;">Start typing to search records...</p>`;
    return;
  }

  const results = [];

  // 1. Contribution records
  activeRecords().forEach(r => {
    if ((r.title || '').toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q)) {
      results.push({
        type: 'Contribution Group',
        icon: '🤝',
        title: r.title,
        desc: `${(r.people || []).length} members ${r.description ? `· ${r.description.slice(0, 45)}...` : ''}`,
        link: `#/r/${r.id}`
      });
    }
    // Search members inside
    (r.people || []).forEach(p => {
      if ((p.name || '').toLowerCase().includes(q) || (p.phone || '').includes(q) || (p.email || '').toLowerCase().includes(q)) {
        results.push({
          type: 'Member',
          icon: '👤',
          title: p.name,
          desc: `In group: ${r.title} · ${p.phone || p.email || 'No contact'}`,
          link: `#/r/${r.id}/${p.id}`
        });
      }
    });
  });

  // 2. Sales
  Store.data.sales.forEach(s => {
    const itemNames = (s.items || []).map(i => i.name).join(' ');
    if ((s.customer_name || '').toLowerCase().includes(q) || itemNames.toLowerCase().includes(q) || (s.notes || '').toLowerCase().includes(q)) {
      results.push({
        type: 'Business Sale',
        icon: '💰',
        title: `${s.customer_name} - ${money(s.total)}`,
        desc: `${itemNames} · ${s.date} (${s.status})`,
        link: `#/business`
      });
    }
  });

  // 3. Customers
  Store.data.customers.forEach(c => {
    if ((c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q) || (c.address || '').toLowerCase().includes(q)) {
      results.push({
        type: 'Customer',
        icon: '🏢',
        title: c.name,
        desc: `${c.phone || 'No phone'} · ${c.address || 'Customer'}`,
        link: `#/business`
      });
    }
  });

  // 4. Debts
  Store.data.debts.forEach(d => {
    if ((d.person_name || '').toLowerCase().includes(q) || (d.notes || '').toLowerCase().includes(q)) {
      results.push({
        type: d.type === 'receivable' ? 'Receivable Debt' : 'Payable Debt',
        icon: '💳',
        title: `${d.person_name} - ${money(d.original_amount)}`,
        desc: `${d.type === 'receivable' ? 'Owed to you' : 'You owe'} ${d.due_date ? `· Due: ${d.due_date}` : ''}`,
        link: `#/debts`
      });
    }
  });

  if (!results.length) {
    resEl.innerHTML = `<div class="empty-box" style="padding:20px;">No matching records found for "${esc(q)}"</div>`;
    return;
  }

  resEl.innerHTML = `
    <div class="list">
      ${results.map(r => `
        <div class="item-card between" style="cursor:pointer;" onclick="closeModal();location.hash='${r.link}'">
          <div class="row">
            <span style="font-size:18px;">${r.icon}</span>
            <div>
              <div style="font-weight:700;">${esc(r.title)}</div>
              <div class="muted small">${esc(r.desc)}</div>
            </div>
          </div>
          <span class="badge badge-gray">${esc(r.type)}</span>
        </div>
      `).join('')}
    </div>
  `;
}

    if (o.saleTotal) rows.push(['Sale total', moneyReal(o.saleTotal)]);

    const wrapped = rows.map(([k, v]) => [k, wrap(v, valW, '600 22px ' + font)]);
    const titleLine = wrap(o.title || 'Official Payment Receipt', W - pad * 2, '500 20px ' + font)[0];

    c.width = W * scale; c.height = H * scale; ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0f766e'; ctx.fillRect(0, 0, W, 12);
    { const g = ctx.createLinearGradient(pad, 26, pad + 44, 70); g.addColorStop(0, '#0f766e'); g.addColorStop(1, '#14b8a6');
      ctx.fillStyle = g; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(pad, 26, 44, 44, 12); else ctx.rect(pad, 26, 44, 44); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.font = '800 28px ' + font; ctx.fillText('R', pad + 22, 58);
      ctx.textAlign = 'left'; ctx.fillStyle = '#0f766e'; ctx.font = '800 26px ' + font; ctx.fillText('Recordly', pad + 56, 58);
      ctx.textAlign = 'right'; ctx.fillStyle = '#94a3b8'; ctx.font = '600 15px ' + font; ctx.fillText('RECEIPT', W - pad, 54);

    ctx.textAlign = 'center'; ctx.fillStyle = '#0f766e';

    ctx.fillStyle = '#64748b'; ctx.font = '500 20px ' + font; ctx.fillText(titleLine, W / 2, 166);
    ctx.font = '500 18px monospace'; ctx.fillText('Ref: ' + o.receiptNo, W / 2, 198);

    window.open('https://wa.me/?text=' + encodeURIComponent(invite), '_blank');
    return;
  }
  if (navigator.share) {
    try { await navigator.share({ text: invite }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (blob) { saveReceiptImage(blob, o); toast('Receipt image saved to your phone.'); } else { copyText(invite); }
}

 * 2. CONTRIBUTIONS SECTION (WITH DELETE AND ADMIN DESCRIPTION)

// ===== Recurring contributions (daily / weekly / monthly / yearly) =====
// For a recurring record, r.period_amount is what each person pays every period and r.target is kept equal to
// "due per person so far", so progress, balances, reminders and public links all keep working unchanged.
const FREQ_UNIT = { daily: 'day', weekly: 'week', monthly: 'month', yearly: 'year' };
const FREQ_NAME = { daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly', yearly: 'Yearly' };
function isRec(r) { return !!(r && r.freq && r.freq !== 'once' && FREQ_UNIT[r.freq] && Number(r.period_amount) > 0); }
function recPeriods(r, ymd) {
  const s0 = r.start || (r.created_at ? localDate(new Date(r.created_at)) : localDate());
  let end = ymd || localDate();
  if (r.end_date && r.end_date < end) end = r.end_date;
  if (end < s0) return 1;
  const [sy, sm, sd] = s0.split('-').map(Number), [ey, em, ed] = end.split('-').map(Number);
  const days = Math.round((Date.UTC(ey, em - 1, ed) - Date.UTC(sy, sm - 1, sd)) / 864e5);
  let n = 1;
  if (r.freq === 'daily') n = days + 1;
  else if (r.freq === 'weekly') n = Math.floor(days / 7) + 1;
  else if (r.freq === 'monthly') { let m = (ey - sy) * 12 + (em - sm); if (ed < sd) m--; n = m + 1; }
  else if (r.freq === 'yearly') { let y = ey - sy; if (em < sm || (em === sm && ed < sd)) y--; n = y + 1; }
  return Math.max(1, n);
}
function applyRecurring(r) { if (isRec(r)) r.target = Number(r.period_amount) * recPeriods(r); }
function applyRecurringAll() { (Store.data.records || []).forEach(applyRecurring); }
function recTag(r) { const n = recPeriods(r), u = FREQ_UNIT[r.freq]; return `${FREQ_NAME[r.freq]} · ${moneyReal(r.period_amount)} each ${u} · ${n} ${u}${n > 1 ? 's' : ''} so far`; }
let recExtOk = null;

let contribSort = 'date_desc';
try {
  const savedSort = localStorage.getItem('rc_contrib_sort');
  if (['date_desc', 'date_asc', 'name_asc', 'name_desc', 'pct_desc', 'pct_asc'].includes(savedSort)) {
    contribSort = savedSort;
  }
} catch (e) {}

function contribRecordStats(r) {
  const paid = (r.people || []).reduce((a, p) => a + paySum(p), 0);
  const target = Number(r.target || 0) * (r.people || []).length;
  const pc = target ? Math.min(100, Math.round(paid / target * 100)) : 0;
  return { paid, target, pc };
}

function sortContribRows(rows) {
  return rows.slice().sort((a, b) => {
    if (contribSort === 'name_asc' || contribSort === 'name_desc') {
      const cmp = (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base', numeric: true });
      if (cmp !== 0) return contribSort === 'name_asc' ? cmp : -cmp;
    } else if (contribSort === 'pct_desc' || contribSort === 'pct_asc') {
      const sa = contribRecordStats(a), sb = contribRecordStats(b);
      if (sa.pc !== sb.pc) return contribSort === 'pct_desc' ? (sb.pc - sa.pc) : (sa.pc - sb.pc);
      if (sa.paid !== sb.paid) return contribSort === 'pct_desc' ? (sb.paid - sa.paid) : (sa.paid - sb.paid);
      const cmp = (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base', numeric: true });
      if (cmp !== 0) return cmp;
    } else {
      const da = Date.parse(a.created_at || '') || 0;
      const db = Date.parse(b.created_at || '') || 0;
      if (da !== db) return contribSort === 'date_asc' ? (da - db) : (db - da);
      const cmp = (a.title || '').localeCompare(b.title || '', undefined, { sensitivity: 'base', numeric: true });
      if (cmp !== 0) return cmp;
    }
    return 0;
  });
}

function setContribSort(mode) {
  contribSort = mode || 'date_desc';
  try { localStorage.setItem('rc_contrib_sort', contribSort); } catch (e) {}

function rfDelRow(i) { rfCollect(); rf.people.splice(i, 1); if (!rf.people.length) rf.people = [{ name: '', phone: '' }]; newRecordForm(3); }

function saveNewRecord() {
  if (!checkPlanQuota('records', 1)) return;
  const title = (rf.title || '').trim();
  if (!title) { toast('Please enter a record title.'); return; }
  const description = (rf.desc || '').trim() || null;
  const target = Number(rf.target) || null;
  const end_date = (rf.date || '') || null;
  const freq = (rf.freq && rf.freq !== 'once' && target) ? rf.freq : 'once';

  const people = (Array.isArray(rf.people) ? rf.people : []).filter(p => p.name).map(p => ({
    id: uid(),
    name: p.name,
    phone: p.phone || null,
    email: p.email || null,
    due_date: p.due_date || null,
    installment_plan: [],
    payments: []
  }));
  if (!checkPlanQuota('members', people.length, { people: [] })) return;

  const newRec = {
    id: uid(),
    title,
    description,
    target,
    freq,
    period_amount: freq !== 'once' ? target : null,
    start: freq !== 'once' ? (rf.start || localDate()) : null,
    end_date,
    show_table: true,
    group_link: true,
    created_at: new Date().toISOString(),
    people
  };

  applyRecurring(newRec);
  Store.data.records.unshift(newRec);
  Store.save();
  try { localStorage.setItem('rc_role', 'admin'); } catch (e) {}   // creating a group makes them an admin
  rf = {};
  toast('Record created successfully!');
  location.hash = '#/r/' + newRec.id;
}

const recentlyAddedMemberIds = new Set();
let memberStatusFilter = 'all';
let memberFilterRid = null;

function getFilteredMembers(r) {
  const q = ($('memberSearch')?.value || '').trim().toLowerCase();
  const tgt = Number(r.target || 0);
  return (r.people || []).filter(p => {
    if (q && !(p.name || '').toLowerCase().includes(q) && !(p.phone || '').includes(q) && !(p.email || '').toLowerCase().includes(q)) return false;
    if (memberFilterRid === r.id && memberStatusFilter !== 'all') {
      const paidAmt = paySum(p);
      const isDone = tgt ? paidAmt >= tgt : paidAmt > 0;
      if (memberStatusFilter === 'paid' && !isDone) return false;
      if (memberStatusFilter === 'unpaid' && isDone) return false;
      if (memberStatusFilter === 'overdue' && !memberScheduleSummary(r, p).overdue) return false;
    }
    return true;
  });
}

function setMemberFilter(rid, mode) {
  memberFilterRid = rid;
  memberStatusFilter = mode || 'all';
  const tabs = $('memberFilterTabs');
  if (tabs) {
    const btns = [...tabs.querySelectorAll('.tab-btn')];
    btns.forEach(b => b.classList.toggle('active', (b.getAttribute('onclick') || '').includes(`'${memberStatusFilter}'`)));
  }
  filterRecordMembers(rid);
}

function renderRecordMembersList(r, people, animate = false) {
  if (!people.length) {
    if ((r.people || []).length > 0) {
      return `
        <div class="empty-box">
          <p class="muted" style="margin:0 0 10px;">No members match your current search or filter.</p>
          <button class="btn-outline btn-sm" onclick="memberStatusFilter='all';if($('memberSearch')){$('memberSearch').value='';$('memberSearch').dispatchEvent(new Event('input'));}setMemberFilter('${r.id}','all')">Clear filters</button>
        </div>
      `;
    }
    return `
      <div class="empty-box">
        <p class="muted" style="margin:0 0 10px;">No members added yet. Add one manually or bulk import from an Excel / CSV spreadsheet.</p>
        <div class="row" style="justify-content:center;">
          <button class="btn-soft btn-sm" onclick="openMemberCsvImportModal('${r.id}')">📥 Import CSV</button>
          <button class="btn-primary btn-sm" onclick="openAddMemberModal('${r.id}')">＋ Add Member</button>
        </div>
      </div>
    `;
  }
  const owner = isRecOwner(r);
  const hasNewOnly = recentlyAddedMemberIds.size > 0;
  return people.map((p, idx) => {
    const paid = paySum(p);
    const target = Number(r.target || 0);
    const pc = target ? Math.min(100, Math.round(paid / target * 100)) : 0;
    const isCompleted = target > 0 && paid >= target;
    const sch = memberScheduleSummary(r, p);
    const openFlag = (paymentReports || []).some(rp => rp.person_id === p.id && rp.status === 'open');
    const isNew = recentlyAddedMemberIds.has(p.id);
    const animClass = animate ? (isNew ? ' member-item-new' : (hasNewOnly ? '' : ' member-item-enter')) : '';
    const animStyle = (animate && !hasNewOnly) ? ` style="--mi:${Math.min(idx, 10)}"` : '';
    return `
      <div class="item-card between${animClass}"${animStyle}>
        <div class="avatar-circle">${esc((p.name || 'M').slice(0, 1).toUpperCase())}</div>
        <div class="grow" style="cursor:pointer;" onclick="location.hash='#/r/${r.id}/${p.id}'">
          <div class="row between">
            <b>${esc(p.name)}</b>
            <span class="badge ${isCompleted ? 'badge-green' : sch.overdue ? 'badge-red' : paid > 0 ? 'badge-amber' : 'badge-gray'}">
              ${isCompleted ? 'Completed' : sch.overdue ? 'Overdue' : paid > 0 ? `${pc}%` : 'Unpaid'}
            </span>
          </div>
          <div class="muted small">${esc(p.phone || 'No phone')}${p.email ? ' · ' + esc(p.email) : ''} · <b>${money(paid)}</b> paid ${target ? `(remains ${money(Math.max(0, target - paid))})` : ''}${p.last_reminded ? ' · reminded ' + remAgo(p.last_reminded) : ''}</div>
          ${(sch.nextDue || openFlag) ? `<div class="row" style="gap:6px;margin-top:4px;flex-wrap:wrap;">
            ${sch.nextDue ? `<span class="tag-inline ${sch.nextDue.overdue ? 'tag-overdue' : 'tag-due'}">${sch.nextDue.overdue ? `Overdue · ${sch.nextDue.daysOverdue}d (${esc(sch.nextDue.due_date)})` : `Next due: ${esc(sch.nextDue.due_date)}${sch.nextDue.amount ? ' (' + money(sch.nextDue.amount) + ')' : ''}`}</span>` : ''}
            ${openFlag ? '<span class="tag-inline tag-overdue">Problem flagged</span>' : ''}
          </div>` : ''}
          ${target ? `<div class="progress-track"><div class="progress-fill" style="width:${pc}%"></div></div>` : ''}
          ${target && !isCompleted ? `<button class="btn-soft btn-sm" style="margin-top:6px;" onclick="event.stopPropagation();remindOne('${r.id}','${p.id}')">Remind</button>` : ''}
        </div>
        <div class="row">
          <button class="btn-primary btn-sm" onclick="location.hash='#/r/${r.id}/${p.id}'">Manage</button>
          ${owner ? `<button class="btn-danger btn-sm" onclick="confirmDeleteMember('${r.id}', '${p.id}')" title="Delete member">✕</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function filterRecordMembers(rid) {
  const r = findRec(rid);
  if (!r) return;
  const filtered = getFilteredMembers(r);
  $('recordMembersList').innerHTML = renderRecordMembersList(r, filtered, false);
}

function toggleRecordProp(rid, prop) {
  if (isStaffMode()) { toast('Only the group owner can change sharing settings.', 'bad'); return; }
  const r = findRec(rid);
  if (!r) return;
  r[prop] = !r[prop];
  Store.save();
  renderRecordDetail(rid);
  toast(extOk === false && (prop === 'hide_balance' || prop === 'discoverable') ? 'Saved on this phone. Run the Supabase SQL upgrade so it also applies online.' : 'Sharing setting updated.');
}

function confirmDeleteRecord(rid) {
  if (isStaffMode()) { toast('Staff helpers cannot delete groups.', 'bad'); return; }
  const r = Store.data.records.find(x => x.id === rid);
  const name = r ? r.title : 'this record';
  if (confirm(`Are you sure you want to permanently delete "${name}" and all its member transactions?`)) {
    Store.data.records = Store.data.records.filter(x => x.id !== rid);
    Store.save();
    toast(`"${name}" was deleted.`);
    if (hash()[0] === 'r') location.hash = '#/contributions';
    else render();
  }
}

async function saveNewMember(rid) {
  const name = val('newMemName');
  if (!name) { toast('Please enter a name.'); return; }
  const phone = val('newMemPhone') || null;
  const email = val('newMemEmail') || null;
  const due_date = val('newMemDue') || null;

  const r = findRec(rid);
  if (!r) return;
  if (!checkPlanQuota('members', 1, r)) return;
  const newPid = uid();
  const memObj = {
    id: newPid,
    name,
    phone,
    email,
    due_date,
    installment_plan: [],
    payments: []
  };
  if (isStaffMode()) {
    const b = $('saveMemBtn'); if (b) { b.disabled = true; b.textContent = 'Saving…'; }
    try {
      const { error } = await sb.from('people').insert({ id: newPid, record_id: rid, name, phone, email, due_date });
      if (error) {
        if (!handleDbPlanError(error)) toast(error.message || 'Could not add member.');
        if (b) { b.disabled = false; b.textContent = 'Add Member'; }
        return;
      }
    } catch (e) {
      if (!handleDbPlanError(e)) toast('Could not save member online.');
      if (b) { b.disabled = false; b.textContent = 'Add Member'; }
      return;
    }
  }
  r.people = r.people || [];
  r.people.push(memObj);
  recentlyAddedMemberIds.add(newPid);
  if (!isStaffMode()) Store.save();
  closeModal();
  toast('Member added!');
  renderRecordDetail(rid);
}

function handleMemberCsvFileSelect(event) {
  const input = event.target;
  const file = input?.files?.[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const text = String(e.target.result || '');
    const pasteBox = $('memberCsvPasteText');
    if (pasteBox) pasteBox.value = text;
    handleMemberCsvTextChange(text);
    if (input) input.value = '';
  };
  reader.readAsText(file);
}

function handleMemberCsvTextChange(rawText) {
  const members = parseMemberCSV(rawText);
  renderMemberCsvPreview(members);
}

function parseMemberCSV(text) {
  if (!text || !text.trim()) return [];
  const cleanText = text.replace(/^\uFEFF/, '');
  const lines = cleanText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];

  const firstLine = lines[0];
  const delim = firstLine.includes(',') ? ',' : (firstLine.includes('\t') ? '\t' : (firstLine.includes(';') ? ';' : ','));

  function splitRow(row) {
    const res = [];
    let cur = '', inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === '"') {
        if (inQuotes && row[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (c === delim && !inQuotes) {
        res.push(cur.trim());
        cur = '';
      } else {
        cur += c;
      }
    }
    res.push(cur.trim());
    return res;
  }

  const rawRows = lines.map(splitRow);
  if (!rawRows.length) return [];

  const first = rawRows[0].map(h => (h || '').toLowerCase().replace(/[^a-z0-9]/g, ''));
  let nameIdx = -1, firstIdx = -1, lastIdx = -1, phoneIdx = -1, emailIdx = -1, dueIdx = -1;

  first.forEach((h, idx) => {
    if (h === 'name' || h === 'fullname' || h === 'member' || h === 'membername' || h === 'person' || h === 'participant' || h === 'contact' || (h.includes('name') && !h.includes('first') && !h.includes('last') && !h.includes('user'))) {
      if (nameIdx === -1) nameIdx = idx;
    } else if (h === 'firstname' || h === 'first') {
      if (firstIdx === -1) firstIdx = idx;
    } else if (h === 'lastname' || h === 'last' || h === 'surname') {
      if (lastIdx === -1) lastIdx = idx;
    } else if (h.includes('phone') || h.includes('tel') || h.includes('mobile') || h.includes('whatsapp') || h.includes('number')) {
      if (phoneIdx === -1) phoneIdx = idx;
    } else if (h.includes('email') || h.includes('mail')) {
      if (emailIdx === -1) emailIdx = idx;
    } else if (h.includes('due') || h.includes('deadline') || h === 'date') {
      if (dueIdx === -1) dueIdx = idx;
    }
  });

  const hasHeader = nameIdx !== -1 || firstIdx !== -1 || lastIdx !== -1 || phoneIdx !== -1 || emailIdx !== -1 || dueIdx !== -1;
  let dataRows = rawRows;
  if (hasHeader) {
    dataRows = rawRows.slice(1);
    if (nameIdx === -1 && firstIdx === -1) {
      nameIdx = first.findIndex((_, idx) => idx !== phoneIdx && idx !== emailIdx && idx !== dueIdx);
      if (nameIdx === -1) nameIdx = 0;
    }
  } else {
    nameIdx = 0;
    phoneIdx = 1;
    emailIdx = 2;
    dueIdx = 3;
  }

  const parsed = [];
  dataRows.forEach(cols => {
    let name = '';
    if (nameIdx !== -1) {
      name = (cols[nameIdx] || '').trim();
    } else if (firstIdx !== -1 || lastIdx !== -1) {
      name = [firstIdx !== -1 ? (cols[firstIdx] || '').trim() : '', lastIdx !== -1 ? (cols[lastIdx] || '').trim() : ''].filter(Boolean).join(' ').trim();
    }
    if (!name) return;
    const phone = phoneIdx !== -1 ? (cols[phoneIdx] || '').trim() : '';
    const email = emailIdx !== -1 ? (cols[emailIdx] || '').trim() : '';
    const dueRaw = dueIdx !== -1 ? (cols[dueIdx] || '').trim() : '';
    const due_date = /^\d{4}-\d{2}-\d{2}$/.test(dueRaw) ? dueRaw : null;
    parsed.push({
      name,
      phone: phone || null,
      email: (email && email.includes('@')) ? email : null,
      due_date
    });
  });

  return parsed;
}

function renderMemberCsvPreview(members) {

async function executeMemberCsvImport() {
  if (!pendingImportMembers.length) {
    toast('No valid members to import.');
    return;
  }

  if (pendingMemberImportTarget === '__wizard__') {
    const existing = (Array.isArray(rf.people) ? rf.people : []).filter(p => p.name || p.phone);
    if (!checkPlanQuota('members', pendingImportMembers.length, { people: existing })) return;
    const added = pendingImportMembers.map(m => ({ name: m.name, phone: m.phone || '', email: m.email || null, due_date: m.due_date || null }));
    rf.people = existing.concat(added);
    const count = added.length;
    closeModal();
    toast(`Added ${count} member${count === 1 ? '' : 's'} to your new group!`);
    newRecordForm(3);
    return;
  }

  const rid = pendingMemberImportTarget || val('memberCsvTargetSelect');
  const r = findRec(rid);
  if (!r) {
    toast('Please select a contribution group.');
    return;
  }
  if (!Array.isArray(r.people)) r.people = [];
  if (!checkPlanQuota('members', pendingImportMembers.length, r)) return;

  const newRows = pendingImportMembers.map(m => ({
    id: uid(),
    name: m.name,
    phone: m.phone || null,
    email: m.email || null,
    due_date: m.due_date || null,
    installment_plan: [],
    payments: []
  }));

  if (isStaffMode()) {
    try {
      const { error } = await sb.from('people').insert(newRows.map(m => ({ id: m.id, record_id: r.id, name: m.name, phone: m.phone, email: m.email, due_date: m.due_date })));
      if (error) {
        if (!handleDbPlanError(error)) toast(error.message || 'Could not import members.');
        return;
      }
    } catch (e) {
      if (!handleDbPlanError(e)) toast('Could not import members online.');
      return;
    }
  }

  newRows.forEach(m => { r.people.push(m); recentlyAddedMemberIds.add(m.id); });
  const count = newRows.length;

  if (!isStaffMode()) Store.save();
  closeModal();
  toast(`Successfully imported ${count} member${count === 1 ? '' : 's'} into "${r.title}"!`);
  if (hash()[0] === 'r' && hash()[1] === r.id) {
    renderRecordDetail(r.id);
  } else {
    render();
  }
}

function downloadMemberCsvTemplate() {
  const content = 'Name,Phone,Email,Due Date\nAmina Bello,08012345678,amina@example.com,2026-12-01\nDavid Adeleke,08087654321,david@example.com,\nChukwuma Eze,07033445566,,\n';

  const a = document.createElement('a');
  a.href = url;

function statementText() {
  const o = window._stmt; if (!o) return '';
  const lines = [
    o.biz + ' - PAYMENT STATEMENT', 'Ref: ' + o.ref, 'Issued: ' + o.issued, '',
    'Name: ' + o.name + (o.phone ? ' (' + o.phone + ')' : ''),
    'For: ' + o.title + (o.due ? ' · ' + o.due : ''), o.plan ? 'Plan: ' + o.plan : '', '',
    'Total paid: ' + moneyReal(o.paid),
    o.target ? (o.rec ? 'Due so far: ' : 'Amount due: ') + moneyReal(o.target) : '',
    o.target ? 'Balance: ' + moneyReal(o.bal) : '', o.status, '', 'PAYMENTS'
  ];
  o.rows.forEach(x => lines.push(x.date + (x.time ? ' ' + x.time : '') + ' · ' + moneyReal(x.amount) + (x.det ? ' · ' + x.det : '') + (x.bal !== null ? ' · Balance ' + moneyReal(x.bal) : '')));
  if (!o.rows.length) lines.push('No payments recorded yet.');
  return lines.filter((l, i) => l !== '' || lines[i - 1] !== '').join('\n');
}
function copyStatementText() {
  const t = statementText(); if (!t) return;
  navigator.clipboard.writeText(t).then(() => toast('Statement copied. Paste it anywhere.'));
}
function statementToPng() {
  return new Promise((resolve, reject) => {
    const o = window._stmt; if (!o) return reject(new Error('No statement'));
    const W = 820, pad = 36, font = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    const c = document.createElement('canvas'), ctx = c.getContext('2d');
    const wrap = (t, maxW, f) => {
      ctx.font = f; const lines = []; let cur = '';
      String(t || '').split(/\s+/).forEach(w => {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
      });
      if (cur) lines.push(cur); return lines.length ? lines : [''];
    };
    const amtRight = o.target ? W - pad - 190 : W - pad, detX = pad + 140, detW = amtRight - 175 - detX;
    const rowData = o.rows.map(x => {
      const lines = wrap(x.det + (x.ref ? ' · ' + x.ref : ''), detW, '500 16px ' + font);
      return { x, lines, h: Math.max(2, lines.length) * 22 + 16 };
    });
    const head = 360 + (o.plan ? 24 : 0) + (o.status ? 30 : 0);
    let H = head + 40 + (rowData.reduce((a, r) => a + r.h, 0) || 60) + 70;
    const scale = H > 6000 ? 1 : 2;
    c.width = W * scale; c.height = H * scale; ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0f766e'; ctx.fillRect(0, 0, W, 12);
    ctx.textAlign = 'left'; ctx.font = '800 30px ' + font; ctx.fillText(wrap(o.biz, W - pad * 2 - 220, '800 30px ' + font)[0], pad, 70);
    ctx.fillStyle = '#64748b'; ctx.font = '500 18px ' + font; ctx.fillText('Statement of payments', pad, 98);
    ctx.textAlign = 'right'; ctx.font = '500 16px monospace'; ctx.fillText('Ref: ' + o.ref, W - pad, 62); ctx.fillText('Issued: ' + o.issued, W - pad, 86);
    ctx.textAlign = 'left'; let y = 150;
    ctx.fillStyle = '#0f172a'; ctx.font = '700 24px ' + font; ctx.fillText(o.name + (o.phone ? '  (' + o.phone + ')' : ''), pad, y);
    ctx.fillStyle = '#64748b'; ctx.font = '500 17px ' + font; y += 28; ctx.fillText(wrap(o.title + (o.due ? ' · ' + o.due : ''), W - pad * 2, '500 17px ' + font)[0], pad, y);
    if (o.plan) { y += 24; ctx.fillText(o.plan, pad, y); }
    y += 26;
    const bw = (W - pad * 2 - 20) / 3;
    const boxes = [['TOTAL PAID', moneyReal(o.paid)], [o.target ? (o.rec ? 'DUE SO FAR' : 'AMOUNT DUE') : 'PAYMENTS', o.target ? moneyReal(o.target) : String(o.rows.length)], [o.target ? 'BALANCE' : 'STATUS', o.target ? moneyReal(o.bal) : 'No fixed amount']];
    boxes.forEach((b, i) => {
      const bx = pad + i * (bw + 10);
      ctx.fillStyle = '#f1f5f9'; ctx.fillRect(bx, y, bw, 74);
      ctx.fillStyle = '#64748b'; ctx.font = '600 13px ' + font; ctx.fillText(b[0], bx + 12, y + 24);
      let sz = 24; do { ctx.font = '800 ' + sz + 'px ' + font; sz -= 1; } while (ctx.measureText(b[1]).width > bw - 24 && sz > 11);
      ctx.fillStyle = '#0f172a'; ctx.fillText(b[1], bx + 12, y + 56);
    });
    y += 74;
    if (o.status) { y += 30; ctx.fillStyle = o.paid >= o.target ? '#0f766e' : '#b45309'; ctx.font = '700 18px ' + font; ctx.fillText(o.status, pad, y); }
    y += 36;
    ctx.fillStyle = '#64748b'; ctx.font = '700 13px ' + font;
    ctx.fillText('DATE', pad, y); ctx.fillText('DETAILS', detX, y);
    ctx.textAlign = 'right'; ctx.fillText('AMOUNT', amtRight, y); if (o.target) ctx.fillText('BALANCE', W - pad, y);
    ctx.textAlign = 'left'; y += 10;
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); ctx.lineWidth = 1;
    if (!rowData.length) {
      ctx.textAlign = 'center'; ctx.fillStyle = '#64748b'; ctx.font = '500 17px ' + font; ctx.fillText('No payments recorded yet.', W / 2, y + 36); ctx.textAlign = 'left'; y += 60;
    }
    rowData.forEach(r => {
      const ty = y + 24;
      ctx.fillStyle = '#0f172a'; ctx.font = '600 16px ' + font; ctx.fillText(r.x.date, pad, ty);
      if (r.x.time) { ctx.fillStyle = '#64748b'; ctx.font = '500 14px ' + font; ctx.fillText(r.x.time, pad, ty + 22); }
      ctx.fillStyle = '#0f172a'; ctx.font = '500 16px ' + font; r.lines.forEach((l, i) => ctx.fillText(l, detX, ty + i * 22));
      ctx.textAlign = 'right'; ctx.font = '700 16px ' + font; ctx.fillText(moneyReal(r.x.amount), amtRight, ty);
      if (o.target) { ctx.font = '500 16px ' + font; ctx.fillText(moneyReal(r.x.bal), W - pad, ty); }
      ctx.textAlign = 'left'; y += r.h;
      ctx.strokeStyle = '#e2e8f0'; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
    });
    ctx.textAlign = 'center'; ctx.fillStyle = '#94a3b8'; ctx.font = '500 15px ' + font;
    ctx.fillText('Issued by ' + o.biz + ' · Recorded with Recordly', W / 2, H - 28);
    c.toBlob(b => b ? resolve(b) : reject(new Error('Could not draw statement')), 'image/png');
  });
}
async function shareStatement(mode) {
  const o = window._stmt; if (!o) return;
  const invite = appInviteText();
  let blob = null;
  try {
    blob = await statementToPng();
    const file = new File([blob], 'statement-' + o.ref + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: invite }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const save = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'statement-' + o.ref + '.png'; document.body.appendChild(a); a.click(); a.remove(); };
  if (mode === 'wa') {
    if (blob) { save(); toast('Statement image saved. Attach it in WhatsApp.'); }
    window.open('https://wa.me/' + remPhone(o.phone) + '?text=' + encodeURIComponent(invite), '_blank');
    return;
  }
  if (navigator.share) { try { await navigator.share({ text: invite }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  if (blob) { save(); toast('Statement image saved to your phone.'); } else copyText(invite);
}
function printStatement() {
  document.body.classList.add('print-stmt');
  const done = () => { document.body.classList.remove('print-stmt'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
}

async function saveMemberPayment(rid, pid) {
  const amt = Number(val('payAmount'));
  if (!amt || amt <= 0) { toast('Please enter a valid payment amount.'); return; }
  const method = val('payMethod');
  const now = new Date();
  const paid_on = val('payDate') || localDate();
  const timeIn = val('payTime');
  let paid_at = null;
  if (timeIn) {
    const t = new Date(paid_on + 'T' + timeIn);
    if (!isNaN(t)) paid_at = t.toISOString();
  } else if (paid_on === localDate(now)) {
    paid_at = now.toISOString();   // paid today and no time typed: the time is right now
  }
  const note = val('payNote') || null;
  const payer_name = val('payerName') || null;
  const payer_phone = val('payerPhone') || null;
  const sendEmailFlag = !!$('paySendEmail')?.checked;

  const r = findRec(rid);
  const p = r?.people?.find(x => x.id === pid);
  if (!r || !p) return;

  const btn = $('savePayBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const payId = uid();
  const proofFile = ($('payProofFile') && $('payProofFile').files && $('payProofFile').files[0]) || null;
  let proof_path = null, proof_preview = null;
  if (proofFile) {
    const up = await uploadPaymentProof(rid, pid, payId, proofFile);
    proof_path = up.path;
    proof_preview = up.preview;
  }

  const payObj = {
    id: payId,
    ref: 'RCP-' + payId.replace(/-/g, '').slice(0, 8).toUpperCase(),
    biz: bizName(),
    amount: amt,
    paid_on,
    paid_at,
    method,
    note,
    payer_name,
    payer_phone,
    logged_by: user ? user.id : null,
    proof_path,
    proof_preview,
    change_log: [],
    created_at: now.toISOString()
  };

  if (isStaffMode()) {
    try {
      const { error } = await sb.from('payments').insert({
        id: payId, person_id: pid, amount: amt, paid_on, paid_at, method, note, payer_name, payer_phone,
        logged_by: user ? user.id : null, proof_path
      });
      if (error) {
        toast(error.message || 'Could not save payment.');
        if (btn) { btn.disabled = false; btn.textContent = 'Save Payment'; }
        return;
      }
    } catch (e) {
      toast('Could not save payment online.');
      if (btn) { btn.disabled = false; btn.textContent = 'Save Payment'; }
      return;
    }
  }

  p.payments = p.payments || [];
  p.payments.push(payObj);

  if (!isStaffMode()) Store.save();
  toast('Payment recorded successfully!');

  // Live Web Push & Realtime Notification to buyer (if claimed)
  dispatchPushAlert({
    recipient_user_id: p.claimed_by || null,
    person_id: pid,
    record_id: rid,
    type: 'payment_logged',
    title: `Payment received: ${moneyReal(amt)}`,
    body: `${r.title} · Recorded on ${paid_on}`,
    link: `#/p/${pid}`
  });

  // Optional automatic Brevo email receipt
  if (sendEmailFlag && p.email) {
    const tgt = Number(r.target || 0);
    const bal = tgt > 0 ? Math.max(0, tgt - paySum(p)) : 0;
    sendBrevoEmail({
      type: 'receipt',
      recordId: rid,
      toEmail: p.email,
      toName: p.name,
      businessName: bizName(),
      recordTitle: r.title,
      amount: moneyReal(amt),
      paidOn: paid_on,
      method,
      receiptRef: payObj.ref,
      balance: bal > 0 ? moneyReal(bal) : '₦0.00',
      note: note || '',
      link: link('p/' + pid)
    }).then(res => { if (res.ok) toast(`Receipt emailed to ${p.email}`); });
  }

  renderMemberAdmin(rid, pid);
}

// Keep alias safe: never silently delete a payment — always require a void reason
function deleteMemberPayment(rid, pid, payId) {
  openVoidPaymentModal(rid, pid, payId);
}

function confirmDeleteMember(rid, pid) {
  if (isStaffMode()) { toast('Staff helpers cannot remove members.', 'bad'); return; }
  if (confirm('Remove this member and their payment history from the record?')) {
    const r = findRec(rid);
    if (!r) return;
    r.people = r.people.filter(p => p.id !== pid);
    Store.save();
    toast('Member removed.');
    location.hash = '#/r/' + rid;
  }
}

function calcSaleTotal() {
  let tot = 0;
  document.querySelectorAll('#saleItems .irow').forEach(r => {
    const q = Number(r.querySelector('.si-qty').value) || 0;
    const pr = Number(String(r.querySelector('.si-price').value).replace(/,/g, '')) || 0;
    const sub = q * pr; tot += sub;
    const el = r.querySelector('.isub'); if (el) el.textContent = sub > 0 ? 'Subtotal ₦' + fmtNum(sub) : '';
  });
  $('saleTotal').value = fmtNum(tot);
  const paid = $('salePaid');
  if (paid && !paid.dataset.touched) paid.value = tot > 0 ? fmtNum(tot) : '';
}

function saveNewSale() {
  const rows = readSaleItems().filter(i => i.name || i.price);
  if (rows.some(i => !i.name)) { toast('Please name every item.'); return; }
  const items = rows.filter(i => i.qty > 0 && i.price > 0);
  if (!items.length) { toast('Add at least one item with a price.'); return; }
  const total = items.reduce((a, i) => a + i.qty * i.price, 0);

  const channel = val('saleChannel') || 'walkin';
  const custId = val('saleCustomer');
  let custName = val('saleWalkInName'), custPhone = val('saleCustPhone') || null, linkedId = custId || null;
  if (custId) {
    const found = Store.data.customers.find(c => c.id === custId);
    if (found) { custName = found.name; custPhone = found.phone || null; }
  } else {
    if (!custName && channel !== 'walkin') { toast("Please add the customer's name for this order."); return; }
    if (!custName) custName = 'Walk-in Customer';
    const save = $('saleSaveCust') && $('saleSaveCust').checked;
    if (save && custName !== 'Walk-in Customer') {
      linkedId = uid();
      Store.data.customers.push({ id: linkedId, name: custName, phone: custPhone, address: null, notes: null, created_at: new Date().toISOString() });
    }
  }

  const paid = Math.min(total, Number(val('salePaid')) || 0);
  const method = val('saleMethod');
  const date = val('saleDate') || localDate();
  const notes = val('saleNotes') || null;

  let status = 'paid';
  if (paid === 0) status = 'unpaid';
  else if (paid < total) status = 'partial';

  const newSale = {
    id: uid(),
    biz: bizName(),
    customer_id: linkedId,
    customer_name: custName,
    customer_phone: custPhone,
    items,
    total,
    amount_paid: paid,
    payment_method: method,
    status,
    channel,
    fulfil: channel === 'walkin' ? 'done' : (val('saleFulfil') || 'pending'),
    deliver_on: channel === 'walkin' ? null : (val('saleDeliverOn') || null),
    date,

  };

  render();

function handleCustomerCsvFileSelect(event) {
  const file = event.target.files?.[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    const pasteBox = $('customerCsvPasteText');
    if (pasteBox) pasteBox.value = text;
    handleCustomerCsvTextChange(text);
  };
  reader.readAsText(file);
}

function handleCustomerCsvTextChange(rawText) {
  const contacts = parseCustomerCSV(rawText);
  renderCustomerCsvPreview(contacts);
}

function parseCustomerCSV(text) {
  if (!text || !text.trim()) return [];
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];

  function splitRow(row) {
    const res = [];
    let cur = '', inQuotes = false;
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === '"') {
        if (inQuotes && row[i+1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        res.push(cur.trim());
        cur = '';
      } else {
        cur += c;
      }
    }
    res.push(cur.trim());
    return res;
  }

  const rawRows = lines.map(splitRow);
  if (!rawRows.length) return [];

  // Inspect first row for column headers
  const first = rawRows[0].map(h => (h || '').toLowerCase().replace(/[^a-z0-9]/g, ''));
  let nameIdx = -1, phoneIdx = -1, addrIdx = -1, notesIdx = -1;

  first.forEach((h, idx) => {
    if (h.includes('name') || h === 'customer' || h === 'contact') nameIdx = idx;
    else if (h.includes('phone') || h.includes('tel') || h.includes('mobile')) phoneIdx = idx;
    else if (h.includes('address') || h.includes('city') || h.includes('location') || h.includes('state')) addrIdx = idx;
    else if (h.includes('note') || h.includes('remark')) notesIdx = idx;
  });

  let dataRows = rawRows;
  if (nameIdx !== -1) {
    // Header row detected
    dataRows = rawRows.slice(1);
  } else {
    // No explicit headers: default to 0 = Name, 1 = Phone, 2 = Address
    nameIdx = 0;
    phoneIdx = 1;
    addrIdx = 2;
  }

  const parsed = [];
  dataRows.forEach(cols => {
    const name = (cols[nameIdx] || '').trim();
    if (!name) return;
    const phone = phoneIdx !== -1 ? (cols[phoneIdx] || '').trim() : '';
    const address = addrIdx !== -1 ? (cols[addrIdx] || '').trim() : '';
    const notes = notesIdx !== -1 ? (cols[notesIdx] || '').trim() : '';
    parsed.push({
      name,
      phone: phone || null,
      address: address || null,
      notes: notes || null
    });
  });

  return parsed;
}

/**
 * 4. DEBT TRACKING SECTION (WITH DELETION)
 */
let debtFilter = 'all';

function renderDebts() {
  updateNavActive('debts');

  const debts = Store.data.debts;
  const todayStr = localDate();

  let owedToMe = 0;
  let iOwe = 0;
  let overdueCount = 0;

  debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    const balance = Math.max(0, Number(d.original_amount || 0) - repaid);
    if (d.type === 'receivable') owedToMe += balance;
    else iOwe += balance;
    if (balance > 0 && d.due_date && d.due_date < todayStr) overdueCount++;
  });

  let filtered = debts;
  if (debtFilter === 'receivable') filtered = debts.filter(d => d.type === 'receivable');
  else if (debtFilter === 'payable') filtered = debts.filter(d => d.type === 'payable');
  else if (debtFilter === 'overdue') {
    filtered = debts.filter(d => {
      const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
      return (Number(d.original_amount || 0) - repaid) > 0 && d.due_date && d.due_date < todayStr;
    });
  }

  $('app').innerHTML = `
    <div class="card">
      <div class="row between">
        <div>
          <h1>💳 Debt & Credit Tracking</h1>
          <p class="muted">Keep track of money owed to you and money you owe others</p>
        </div>
        <button class="btn-primary" onclick="openDebtModal()">＋ Add Debt</button>
      </div>

      <div class="grid-3" style="margin-top:14px;">
        <div class="stat-box green">
          <div class="stat-label">Owed to You (Receivable)</div>
          <div class="stat-val">${money(owedToMe)}</div>
        </div>
        <div class="stat-box red">
          <div class="stat-label">You Owe (Payable)</div>
          <div class="stat-val">${money(iOwe)}</div>
        </div>
        <div class="stat-box ${overdueCount > 0 ? 'amber' : ''}">
          <div class="stat-label">Overdue Debts</div>
          <div class="stat-val">${overdueCount}</div>
        </div>
      </div>
    </div>

    <!-- Segmented Filter -->
    <div class="tab-bar">
      <button class="tab-btn ${debtFilter === 'all' ? 'active' : ''}" onclick="debtFilter='all';renderDebts();">All (${debts.length})</button>
      <button class="tab-btn ${debtFilter === 'receivable' ? 'active' : ''}" onclick="debtFilter='receivable';renderDebts();">Owed to Me</button>
      <button class="tab-btn ${debtFilter === 'payable' ? 'active' : ''}" onclick="debtFilter='payable';renderDebts();">I Owe</button>
      <button class="tab-btn ${debtFilter === 'overdue' ? 'active' : ''}" onclick="debtFilter='overdue';renderDebts();">Overdue (${overdueCount})</button>
    </div>

    <div class="list">
      ${renderDebtList(filtered, todayStr)}
    </div>
  `;
}

function renderDebtList(debts, todayStr) {
  if (!debts.length) {
    const hasAny = (Store.data.debts || []).length > 0;
    return `
      <div class="card empty-box">
        <h3>${hasAny ? 'No debts matching filter' : 'No debts recorded yet'}</h3>
        <p class="muted">${hasAny ? 'Try another filter or add a new debt record.' : 'Add receivables or payables to never lose track of money balances.'}</p>
        <div class="row" style="justify-content:center;margin-top:10px;">
          ${hasAny ? `<button class="btn-outline" onclick="debtFilter='all';renderDebts();">Show all debts</button>` : ''}
          <button class="btn-primary" onclick="openDebtModal()">＋ Record Debt</button>
        </div>
      </div>
    `;
  }

  return debts.map(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    const original = Number(d.original_amount || 0);
    const balance = Math.max(0, original - repaid);
    const isPaid = balance === 0;
    const isOverdue = !isPaid && d.due_date && d.due_date < todayStr;
    const isReceivable = d.type === 'receivable';

    return `
      <div class="card" style="margin-bottom:12px;">
        <div class="row between">
          <div class="row">
            <span class="badge ${isReceivable ? 'badge-green' : 'badge-red'}">
              ${isReceivable ? 'Owed to Me' : 'I Owe'}
            </span>
            ${isOverdue ? `<span class="badge badge-red">⚠️ Overdue</span>` : ''}
            ${isPaid ? `<span class="badge badge-green">✓ Paid Off</span>` : ''}
          </div>
          <div class="row">
            ${!isPaid ? `
              <button class="btn-primary btn-sm" onclick="openRepaymentModal('${d.id}')">＋ Repayment</button>
            ` : ''}
            <button class="btn-soft btn-sm" onclick="openDebtReceipt('${d.id}')">Statement</button>
            <button class="btn-danger btn-sm" onclick="confirmDeleteDebt('${d.id}')" title="Delete debt">Delete</button>
          </div>
        </div>

        <div class="row between" style="margin-top:10px;">
          <div>
            <h3 style="margin:0;">${esc(d.person_name)}</h3>
            <div class="muted small">${esc(d.phone || 'No phone')} ${d.notes ? `· ${esc(d.notes)}` : ''}</div>
            ${d.due_date ? `<div class="small ${isOverdue ? 'badge-red' : 'muted'}" style="margin-top:4px;">Due Date: <b>${esc(d.due_date)}</b></div>` : ''}
          </div>
          <div style="text-align:right;">
            <div class="muted small">Remaining Balance:</div>
            <div style="font-size:20px;font-weight:900;color:${isReceivable ? '#0f766e' : '#e11d48'};">${money(balance)}</div>
            <div class="small muted">Original: ${money(original)} · Repaid: ${money(repaid)}</div>
          </div>
        </div>

        ${(d.repayments || []).length ? `
          <div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;">
            <b class="muted">Repayment History:</b>
            <div class="row" style="margin-top:4px;">
              ${d.repayments.map(r => `
                <span class="badge badge-gray">${esc(r.date)}: ${money(r.amount)} ${r.note ? `(${esc(r.note)})` : ''}</span>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

    toast('Please enter person name and a valid debt amount.');

  }

  Store.data.debts.unshift({
    id: uid(),
    type,
    biz: bizName(),

function saveDebtRepayment(debtId) {
  const d = Store.data.debts.find(x => x.id === debtId);
  if (!d) return;
  const amt = Number(val('repAmount'));
  if (!amt || amt <= 0) { toast('Please enter a valid amount.'); return; }

  if (!d.repayments) d.repayments = [];
  d.repayments.push({
    id: uid(),
    amount: amt,
    date: val('repDate') || localDate(),
    at: new Date().toISOString(),
    note: val('repNote') || 'Repayment',
    biz: bizName()
  });

  Store.save();
  closeModal();
  toast('Repayment recorded!');
  render();
}

function confirmDeleteDebt(debtId) {
  if (confirm('Permanently delete this debt record and all repayment logs?')) {
    Store.data.debts = Store.data.debts.filter(d => d.id !== debtId);
    Store.save();
    toast('Debt record deleted.');
    render();
  }
}

function exportDataToCSV() {
  let csv = 'SECTION,TITLE_OR_NAME,AMOUNT_OR_TOTAL,STATUS_OR_DATE,NOTES\n';

  activeRecords().forEach(r => {
    (r.people || []).forEach(p => {
      const paid = paySum(p);
      csv += `"Contribution: ${r.title}","${p.name}",${paid},"${p.due_date || r.end_date || 'Ongoing'}","Phone: ${p.phone || ''} | Email: ${p.email || ''} | ${r.description || ''}"\n`;
    });
  });

  Store.data.sales.forEach(s => {
    csv += `"Sale","${s.customer_name}",${s.total},"${s.date} - ${s.status}","Paid: ${s.amount_paid} | ${s.payment_method}"\n`;
  });

  Store.data.expenses.forEach(e => {
    csv += `"Expense: ${e.category}","${e.description}",${e.amount},"${e.date}",""\n`;
  });

  Store.data.debts.forEach(d => {
    const repaid = (d.repayments || []).reduce((a, r) => a + Number(r.amount || 0), 0);
    csv += `"Debt (${d.type})","${d.person_name}",${d.original_amount},"${d.due_date || 'No date'}","Repaid: ${repaid}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `recordly_export_${localDate()}.csv`;
  a.click();
  toast('CSV report downloaded!');
}

function notifTime(ms) {

  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  return diff === 0 ? 'Today ' + t : diff === 1 ? 'Yesterday ' + t : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + t;
}

  if (!p) {
    try {
      let res = await sb.rpc('rc_person_view', { pid });
      if (res.error || !res.data) res = await sb.rpc('get_person_view', { pid });
      const data = res.data;
      if (!res.error && data) {
        p = {
          id: pid,

          due_date: data.due_date || null,
          installment_plan: Array.isArray(data.installment_plan) ? data.installment_plan : [],

  } else {

/**
 * AUTOMATIC REMINDERS + OFFLINE NOTIFICATIONS
 * Recordly works out who is due a reminder and prepares the message; one tap sends it (WhatsApp / SMS).
 * Phone notifications are built from a snapshot saved on the phone, so they work with no internet.
 */
const REM_DEFAULT = { on: true, daysBefore: 3, every: 7, daily: true, hour: 8, notify: false,
  tpl: 'Hi {name}, a friendly reminder from {business}: you have {balance} left to pay for {record} ({paid} of {target} paid). Thank you!' };
function remCfg() { try { return { ...REM_DEFAULT, ...(JSON.parse(localStorage.getItem('rc_remind') || '{}')) }; } catch (e) { return { ...REM_DEFAULT }; } }
function remSave(c) { try { localStorage.setItem('rc_remind', JSON.stringify(c)); } catch (e) {} scheduleSnapshot(); }
const REM_DAY = 864e5;
const paidOf = p => paySum(p);
const debtBal = d => Number(d.original_amount || 0) - (d.repayments || []).reduce((a, x) => a + Number(x.amount || 0), 0);
const daysUntil = ds => { if (!ds) return null; const a = new Date(ds + 'T00:00:00'), b = new Date(localDate() + 'T00:00:00'); return Math.round((a - b) / REM_DAY); };
const remAgo = iso => { const d = Math.floor((Date.now() - Date.parse(iso)) / REM_DAY); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
function remPhone(p) { let t = String(p || '').replace(/[^\d+]/g, ''); if (!t) return ''; if (t[0] === '+') return t.slice(1); if (t.startsWith('00')) return t.slice(2); if (t[0] === '0') return '234' + t.slice(1); return t; }

// who is due a reminder (all = everyone who has not paid)
function dueNudges(cfg, onlyRid, all) {
  const now = Date.now(), out = [];
  activeRecords().forEach(r => {
    if (onlyRid && r.id !== onlyRid) return;
    const target = Number(r.target || 0);
    const dl = (r.end_date && !isRec(r)) ? daysUntil(r.end_date) : null;
    (r.people || []).forEach(p => {
      const paid = paidOf(p), bal = target ? Math.max(0, target - paid) : 0;
      const sched = memberScheduleSummary(r, p);
      if (target && bal <= 0 && !sched.nextDue) return;
      const last = p.last_reminded ? Date.parse(p.last_reminded) : 0;
      const since = last ? (now - last) / REM_DAY : Infinity;
      let due = false, why = '';
      if (sched.nextDue && sched.nextDue.overdue) {
        due = since >= 2;
        why = 'Overdue (' + sched.nextDue.due_date + ')';
      } else if (sched.nextDue && sched.nextDue.daysLeft !== null && sched.nextDue.daysLeft <= cfg.daysBefore) {
        due = since >= 2;
        why = sched.nextDue.daysLeft === 0 ? 'Instalment due today' : 'Due in ' + sched.nextDue.daysLeft + 'd';
      } else if (dl !== null && dl < 0) {
        due = since >= 3; why = 'Overdue';
      } else if (dl !== null && dl <= cfg.daysBefore) {
        due = since >= 2; why = dl === 0 ? 'Closes today' : 'Closes in ' + dl + (dl === 1 ? ' day' : ' days');
      } else if (dl === null && target) {
        const ref = last || Date.parse(r.created_at || '') || 0;
        due = !!ref && (now - ref) / REM_DAY >= cfg.every;
        why = 'Not paid yet';
      }
      if (due || all) {
        const remBal = bal || (sched.nextDue ? sched.nextDue.amount : 0);
        if (!target && !sched.nextDue) return;
        out.push({ kind: 'person', rid: r.id, pid: p.id, name: p.name, phone: p.phone || '', email: p.email || '', title: r.title, bal: remBal, paid, target: target || remBal, why: why || 'Not paid yet', key: r.id + '|' + p.id });
      }
    });
  });
  return out;
}
function dueDebtNudges(cfg, all) {
  const out = [];
  (Store.data.debts || []).forEach(d => {
    if (d.type !== 'receivable') return;
    const bal = debtBal(d); if (bal <= 0 || !d.due_date) return;
    const dl = daysUntil(d.due_date), last = d.last_reminded ? Date.parse(d.last_reminded) : 0, since = last ? (Date.now() - last) / REM_DAY : Infinity;
    if ((dl <= cfg.daysBefore && since >= 3) || all) out.push({ kind: 'debt', did: d.id, name: d.person_name, phone: d.phone || d.person_phone || '', email: d.email || '', title: 'Debt', bal, due: d.due_date, why: dl < 0 ? 'Overdue' : dl === 0 ? 'Due today' : 'Due in ' + dl + ' days', key: 'debt|' + d.id });
  });
  return out;
}
function remindText(n) {
  const cfg = remCfg(), biz = (Store.data.settings && Store.data.settings.businessName) || 'Recordly';
  if (n.kind === 'debt') return `Hi ${n.name}, a friendly reminder from ${biz}: ${moneyReal(n.bal)} is due${n.due ? ' on ' + n.due : ''}. Thank you!`;
  const o = { name: n.name, business: biz, record: n.title, balance: moneyReal(n.bal), paid: moneyReal(n.paid), target: moneyReal(n.target) };
  return cfg.tpl.replace(/\{(\w+)\}/g, (m, k) => o[k] !== undefined ? o[k] : m);
}
function markReminded(n) {
  const now = new Date().toISOString();
  if (n.kind === 'debt') { const d = (Store.data.debts || []).find(x => x.id === n.did); if (d) d.last_reminded = now; }
  else { const r = findRec(n.rid), p = r && (r.people || []).find(x => x.id === n.pid); if (p) p.last_reminded = now; }
  try { Store.save(); } catch (e) {}
  scheduleSnapshot();
}
async function sendOne(n, via) {
  const txt = remindText(n);
  if (via === 'email') {
    if (!n.email) { toast('No email saved for this buyer.'); return false; }
    toast('Sending reminder email via Brevo…');
    const res = await sendBrevoEmail({
      type: 'reminder',
      recordId: n.rid || '',
      toEmail: n.email,
      toName: n.name,
      businessName: bizName(),
      recordTitle: n.title,
      balance: moneyReal(n.bal),
      paid: moneyReal(n.paid || 0),
      target: moneyReal(n.target || n.bal),
      dueDate: n.due || n.why || '',
      message: txt,
      link: n.pid ? link('p/' + n.pid) : appLink()
    });
    if (res && res.ok) {
      markReminded(n);
      toast(`Email reminder sent to ${n.email}!`);
      return true;
    }
    return false;
  }
  if (via === 'sms') location.href = 'sms:' + (n.phone || '') + '?body=' + encodeURIComponent(txt);
  else window.open('https://wa.me/' + remPhone(n.phone) + '?text=' + encodeURIComponent(txt), '_blank');
  markReminded(n);
  return true;
}
function remindOne(rid, pid) {
  const n = dueNudges(remCfg(), rid, true).find(x => x.pid === pid); if (!n) { toast('This person has paid in full.'); return; }
  sendOne(n, 'wa'); toast('Reminder opened in WhatsApp.');
}

// the reminder queue (one tap per person, or "Send next")
let remQueue = [], remSent = new Set(), remScope = null, remAll = false;
function openRemindQueue(rid, all) {
  remScope = rid || null; remAll = !!(all || rid); remSent = new Set();
  const cfg = remCfg();
  remQueue = dueNudges(cfg, remScope, remAll).concat(remScope ? [] : dueDebtNudges(cfg, remAll));
  renderRemindQueue();
}
function renderRemindQueue() {
  const left = remQueue.filter(n => !remSent.has(n.key)).length, cfg = remCfg();
  const preview = remQueue.length ? remindText(remQueue[0]) : cfg.tpl;
  $('modalRoot').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-window" style="max-width:460px;">

    ${remQueue.length ? `
      <div class="rc-prev" style="text-align:left;border-color:var(--line);background:var(--box-bg);color:var(--text);padding:10px 12px;margin:4px 0 10px;"><div class="small muted" style="margin-bottom:3px;">MESSAGE · <a onclick="openReminderSettings()" style="color:var(--primary);font-weight:700;cursor:pointer;">edit</a></div><div style="font-size:13px;">${esc(preview)}</div></div>
      <button class="btn-primary full" style="height:48px;border-radius:14px;margin-bottom:8px;" ${left ? '' : 'disabled'} onclick="sendNextReminder()">${left ? 'Send next WhatsApp (' + left + ' left)' : 'All done ✓'}</button>
      <div class="list" style="max-height:46vh;overflow:auto;">
        ${remQueue.map((n, i) => `<div class="item-card between" style="padding:10px 12px;gap:8px;flex-wrap:wrap;">
          <div class="grow" style="min-width:0;"><b>${esc(n.name)}</b><div class="muted small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(n.title)} · ${moneyReal(n.bal)} · ${esc(n.why)}</div></div>
          ${remSent.has(n.key) ? '<span class="badge badge-green">Sent ✓</span>' : `<span class="row" style="gap:6px;flex-wrap:nowrap;"><button class="btn-primary btn-sm" onclick="queueSend(${i},'wa')">WhatsApp</button>${n.email ? `<button class="btn-soft btn-sm" onclick="queueSend(${i},'email')">Email</button>` : ''}${n.phone ? `<button class="btn-outline btn-sm" onclick="queueSend(${i},'sms')">SMS</button>` : ''}</span>`}
        </div>`).join('')}
      </div>
      ${!remScope && !remAll ? '<button class="btn-outline btn-sm" style="margin-top:10px;" onclick="openRemindQueue(null,true)">Show everyone who has not paid</button>' : ''}
    ` : `<div class="empty-box"><h3>Nobody is due a reminder</h3><p class="muted small">Recordly will tell you when someone should be nudged.</p><button class="btn-outline btn-sm" onclick="openRemindQueue(null,true)">Show everyone who has not paid</button></div>`}
  </div></div>`;
}
async function queueSend(i, via) {
  const n = remQueue[i];
  if (!n) return;
  const ok = await sendOne(n, via);
  if (ok) {
    remSent.add(n.key);
    renderRemindQueue();
  }
}
async function sendNextReminder() { const i = remQueue.findIndex(n => !remSent.has(n.key)); if (i >= 0) await queueSend(i, 'wa'); }
function remindCardHtml() {
  const cfg = remCfg(), n = dueNudges(cfg).length + dueDebtNudges(cfg).length;
  return `<div class="card">
    <div class="row between" style="flex-wrap:nowrap;gap:10px;">

  </div>`;
}

// phone notifications that also work offline (snapshot in IndexedDB, shown by the service worker)
function idbOpen() { return new Promise((res, rej) => { const q = indexedDB.open('recordly-rem', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function kvSet(k, v) { const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => { db.close(); res(); }; t.onerror = () => rej(t.error); }); }
function buildNotifItems(cfg) {
  const items = [], now = Date.now(), withAmt = !maskMoney, today = localDate();
  const addDays = (ymd, n) => { const d = new Date(ymd + 'T12:00:00'); d.setDate(d.getDate() + n); return localDate(d); };
  const at = ymd => { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d, cfg.hour, 0, 0).getTime(); };
  const push = (tag, when, title, body, url) => { if (when > now - 36 * 3600e3 && when < now + 15 * REM_DAY) items.push({ tag, when, title, body, url }); };
  const inDays = n => n === 1 ? 'tomorrow' : 'in ' + n + ' days';
  activeRecords().forEach(r => {
    (r.people || []).forEach(p => {
      const sched = memberScheduleSummary(r, p);
      if (sched.nextDue && sched.nextDue.due_date) {
        const tail = withAmt && sched.nextDue.amount ? ' (' + moneyReal(sched.nextDue.amount) + ')' : '';
        push(`mem|${p.id}|${sched.nextDue.due_date}`, at(sched.nextDue.due_date), `${p.name}: ${sched.nextDue.label} due`, `${r.title}${tail}`, `#/r/${r.id}/${p.id}`);
      }
    });
    if (!r.end_date || !Number(r.target) || isRec(r)) return;
    const unpaid = (r.people || []).filter(p => paidOf(p) < Number(r.target)).length; if (!unpaid) return;

async function upsertSafe(table, rows, extKeys) {
  if (!rows.length) return;
  if (extOk !== false) {
    const res = await sb.from(table).upsert(rows);
    if (!res.error) return;
    const msg = String(res.error.message || '') + ' ' + String(res.error.code || '');
    if (!/column|schema cache|PGRST204|42703/i.test(msg)) throw res.error;
    extOk = false;   // new columns are not in the database yet: save the basics so nothing is lost
  }
  const base = rows.map(r => { const c = Object.assign({}, r); extKeys.forEach(k => delete c[k]); return c; });
  const res2 = await sb.from(table).upsert(base);
  if (res2.error) throw res2.error;
}
